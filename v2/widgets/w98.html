* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  overflow-wrap: break-word;
  font-family: var(--qw-font-family, 'QW98Sans', sans-serif);
  -webkit-font-smoothing: none; /* keeps the bitmap-style W98 font crisp instead of anti-aliased */
}

/* main fills the entire overlay canvas. All the --qw-* custom properties
   below are the widget's live color palette - either set here from the
   Colors - Custom fields, or overwritten wholesale by applyColorPreset() in
   the JS when a named preset is chosen. */
main {
  position: absolute;
  inset: 0;
  font-size: 15px;
  font-weight: normal;

  --qw-title-1: #30E8E8;
  --qw-title-2: #8D6CAA;
  --qw-title-angle: 45deg;
  --qw-title-text: #1F4496;

  --qw-face-1: #2B68CF;
  --qw-face-2: #5C45D5;

  --qw-bevel-hi: #30E893;
  --qw-bevel-lo: #000000;

  --qw-panel-bg: #FFFFFF;
  --qw-panel-text: #1A1A3A;

  --qw-btn-bg: #2B68CF;
  --qw-btn-icon: #30E8E8;
}

/* List mode uses real flexbox with margin-based spacing between windows
   (see the qw-dir-x / margin rules further down), not forced overlap. */
main.qw-list {
  display: flex;
  padding: 30px;
  align-items: flex-end;
}

main.qw-dir-bottom { flex-direction: column-reverse; }
main.qw-dir-top { flex-direction: column; }
main.qw-dir-left { flex-direction: row; }
main.qw-dir-right { flex-direction: row-reverse; }

/* Editor-only overlay shown when Preview Mode is on and you're in the
   StreamElements editor (see the JS's onWidgetLoad) - a dashed border plus
   the message below, so it's obvious the widget isn't broken, it's just
   demoing itself. Both pieces are pure CSS, toggled by the qw-preview class. */
main.qw-preview::before {
  content: '';
  position: absolute;
  inset: 30px;
  border: 8px dashed #fff;
  box-shadow: 0 0 6px #000;
  background: #0007;
  z-index: -20;
}

main.qw-preview::after {
  content: 'Preview Mode is on \a Turn it off in fields once you are done editing.';
  white-space: pre-wrap;
  position: absolute;
  inset: 30px;
  padding: 24px;
  color: #fff;
  font-family: Tahoma, sans-serif;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 0 0 4px #000, 0 0 2px #000;
  background: #000a;
  z-index: -10;
}

.qw-spacer { flex: 1; }

/* One chat message window. Position/visibility are controlled by the JS
   (scheduleReveal sets qw-visible once the Delay Before Visible elapses).
   The face gradient plus the doubled inset box-shadows below are what fake
   the classic beveled 3D window edge. */
.qw-window {
  --qw-shadow-dk: #000000;
  --qw-shadow-lt: #ffffff;
  position: absolute;
  visibility: hidden;
  width: fit-content;
  max-width: calc(400px + 20px);
  background: linear-gradient(var(--qw-title-angle), var(--qw-face-1), var(--qw-face-2));
  box-shadow:
    inset  1px  1px 0 0 var(--qw-shadow-lt),
    inset -1px -1px 0 0 var(--qw-shadow-dk),
    inset  2px  2px 0 0 var(--qw-bevel-hi),
    inset -2px -2px 0 0 var(--qw-bevel-lo);
  padding: 3px;
}

main.qw-fixed-width .qw-window {
  width: calc(400px + 20px);
}

main.qw-list .qw-window { position: relative; }

main.qw-dir-top .qw-window { margin-bottom: 15px; }
main.qw-dir-bottom .qw-window { margin-top: 15px; }
main.qw-dir-left .qw-window { margin-right: 15px; }
main.qw-dir-right .qw-window { margin-left: 15px; }

.qw-window.qw-visible { visibility: visible; }

/* Rainbow effect for Twitch "Highlight My Message" when Highlighted Message
   Style is set to Rainbow - see the qw-highlight class added in the JS. */
.qw-window.qw-highlight {
  animation: qw-rainbow 6s linear infinite;
}

.qw-titlebar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 3px;
  background: linear-gradient(var(--qw-title-angle), var(--qw-title-1), var(--qw-title-2));
  color: var(--qw-title-text);
  font-weight: bold;
  white-space: nowrap;
}

.qw-titletext {
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 3px;
}

.qw-badge {
  height: 0.75rem;
  vertical-align: middle;
}

.qw-pronoun {
  border: 1px solid currentcolor;
  border-radius: 3px;
  font-size: .7rem;
  padding: 0 3px;
}

.qw-pronoun.qw-pronoun-custom {
  color: #FFFFFF;
  background: #000000;
  border-color: #FFFFFF;
}

.qw-titlebar-buttons {
  display: flex;
  gap: 2px;
  margin-left: auto;
}

/* Minimize/maximize/close are visual only - purely decorative, matching a
   real window's title bar chrome. */
.qw-titlebar-buttons button {
  width: 15px;
  height: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--qw-btn-bg);
  border: none;
  box-shadow:
    inset  1px  1px 0 0 var(--qw-shadow-lt),
    inset -1px -1px 0 0 var(--qw-shadow-dk),
    inset  2px  2px 0 0 var(--qw-bevel-hi),
    inset -2px -2px 0 0 var(--qw-bevel-lo);
  padding: 0;
}

.qw-titlebar-buttons svg {
  width: 8px;
  height: 8px;
  fill: var(--qw-btn-icon);
}

/* The actual message text/emotes live here, in their own recessed white
   panel on top of the window's face color. max-height + overflow:hidden
   means a message longer than Message Max Height gets clipped rather than
   growing the window indefinitely. */
.qw-panel {
  margin-top: 3px;
  background: var(--qw-panel-bg);
  color: var(--qw-panel-text);
  box-shadow:
    inset -1px -1px 0 0 var(--qw-shadow-lt),
    inset  1px  1px 0 0 var(--qw-shadow-dk);
  padding: 6px;
  max-width: 400px;
  max-height: 300px;
  overflow: hidden;
  direction: ltr;
}

.qw-window.qw-action .qw-text { font-style: italic; }
.qw-window.qw-action .qw-emote { transform: skew(-5deg); }
.qw-window.qw-highlight .qw-panel { color: #111; }

.qw-emote {
  vertical-align: middle;
  margin: -3px 0;
}

.qw-emotesize-1 .qw-emote { height: 1.7rem; }
.qw-emotesize-2 .qw-emote { height: 3.4rem; }
.qw-emotesize-4 .qw-emote { height: 6.5rem; }

/* Entrance animation classes - the JS adds one of these based on the
   Entrance Animation field. qw-leaving (below) plays on the way out,
   always the same fade regardless of which entrance animation was used. */
.qw-anim-pop { animation: qw-pop-in .35s ease-out; }
.qw-anim-fade { animation: qw-fade-in .35s ease-out; }
.qw-anim-fade-up { animation: qw-fade-in .35s ease-out, qw-slide-up .35s ease-out; }
.qw-anim-fade-down { animation: qw-fade-in .35s ease-out, qw-slide-down .35s ease-out; }
.qw-anim-fade-left { animation: qw-fade-in .35s ease-out, qw-slide-left .35s ease-out; }
.qw-anim-fade-right { animation: qw-fade-in .35s ease-out, qw-slide-right .35s ease-out; }

.qw-window.qw-leaving {
  animation: qw-fade-out .4s ease-in forwards;
}

@keyframes qw-pop-in {
  0% { transform: scale(.6); opacity: 0; }
  70% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes qw-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes qw-fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes qw-slide-up { from { transform: translateY(40px); } to { transform: translateY(0); } }
@keyframes qw-slide-down { from { transform: translateY(-40px); } to { transform: translateY(0); } }
@keyframes qw-slide-left { from { transform: translateX(40px); } to { transform: translateX(0); } }
@keyframes qw-slide-right { from { transform: translateX(-40px); } to { transform: translateX(0); } }

/* Used by .qw-window.qw-highlight above - was missing entirely before,
   which meant Highlighted Message Style: Rainbow never actually animated. */
@keyframes qw-rainbow {
  0%   { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

<script>
// Quantumtherobot Window Chat - original widget by Quantumtherobot

// Runtime state: current field values, channel info, how many message
// windows are currently on screen, and caches for pronoun/7TV lookups.
const QW = {
  fields: {},
  channel: {},
  messageCount: 0,
  pronounNames: {},
  pronounCache: {},
  globalEmotes: {},
  sevenTV: {},
}

// Named color palettes. Each maps directly onto the CSS custom properties
// declared in the widget's main rule (see widget.css) - applyColorPreset()
// below just copies these onto the DOM when a named preset (not "Custom") is picked.
const QW_PALETTES = {
  qntmos: {
    '--qw-title-1': '#30E8E8', '--qw-title-2': '#8D6CAA', '--qw-title-text': '#1F4496',
    '--qw-face-1': '#2B68CF', '--qw-face-2': '#5C45D5',
    '--qw-bevel-hi': '#30E893', '--qw-bevel-lo': '#000000',
    '--qw-panel-bg': '#FFFFFF', '--qw-panel-text': '#1A1A3A',
    '--qw-btn-bg': '#2B68CF', '--qw-btn-icon': '#30E8E8',
  },
  classicGrey: {
    '--qw-title-1': '#000080', '--qw-title-2': '#1084D0', '--qw-title-text': '#FFFFFF',
    '--qw-face-1': '#C0C0C0', '--qw-face-2': '#C0C0C0',
    '--qw-bevel-hi': '#DFDFDF', '--qw-bevel-lo': '#808080',
    '--qw-panel-bg': '#FFFFFF', '--qw-panel-text': '#000000',
    '--qw-btn-bg': '#C0C0C0', '--qw-btn-icon': '#000000',
  },
  hotdogStand: {
    '--qw-title-1': '#FF0000', '--qw-title-2': '#FF0000', '--qw-title-text': '#FFFF00',
    '--qw-face-1': '#FF0000', '--qw-face-2': '#B30000',
    '--qw-bevel-hi': '#FFFFFF', '--qw-bevel-lo': '#000000',
    '--qw-panel-bg': '#FFFFFF', '--qw-panel-text': '#000000',
    '--qw-btn-bg': '#FF0000', '--qw-btn-icon': '#FFFF00',
  },
  dark98: {
    '--qw-title-1': '#2A2A3D', '--qw-title-2': '#1B1B29', '--qw-title-text': '#8FD8FF',
    '--qw-face-1': '#1B1B29', '--qw-face-2': '#13141A',
    '--qw-bevel-hi': '#3B3B55', '--qw-bevel-lo': '#000000',
    '--qw-panel-bg': '#0E0E16', '--qw-panel-text': '#DDE6FF',
    '--qw-btn-bg': '#1B1B29', '--qw-btn-icon': '#8FD8FF',
  },
  jungle: {
    '--qw-title-1': '#6FA83E', '--qw-title-2': '#2E5C1F', '--qw-title-text': '#FFF6D9',
    '--qw-face-1': '#3E6B27', '--qw-face-2': '#24401A',
    '--qw-bevel-hi': '#A6D46B', '--qw-bevel-lo': '#12200D',
    '--qw-panel-bg': '#FFFDF3', '--qw-panel-text': '#26361A',
    '--qw-btn-bg': '#3E6B27', '--qw-btn-icon': '#A6D46B',
  },
  maple: {
    '--qw-title-1': '#E08A3C', '--qw-title-2': '#9C3B1E', '--qw-title-text': '#FFF3E0',
    '--qw-face-1': '#B85C2A', '--qw-face-2': '#7A2E14',
    '--qw-bevel-hi': '#F6C177', '--qw-bevel-lo': '#3D1607',
    '--qw-panel-bg': '#FFF8EE', '--qw-panel-text': '#4A2410',
    '--qw-btn-bg': '#B85C2A', '--qw-btn-icon': '#F6C177',
  },
}

// Copies the chosen preset's colors onto the widget's CSS custom properties.
// If Color Preset is set to "Custom", there's no matching entry here, so this
// is a no-op and the field-driven --qw-* values from widget.css just apply as-is.
function applyColorPreset() {
  const preset = QW_PALETTES[QW.fields.colorPreset]
  if (!preset) return // "custom" -> leave the field-driven CSS variables alone
  const root = document.querySelector('main')
  for (const [prop, value] of Object.entries(preset)) {
    root.style.setProperty(prop, value)
  }
}

// Resolves the Font Source field (built-in/local/google) into an actual
// font-family stack and writes it to --qw-font-family, which widget.css reads.
function applyFontSource() {
  const root = document.querySelector('main')
  let family = `'QW98Sans', sans-serif`
  if (QW.fields.fontSource === 'local' && QW.fields.localFontName.trim()) {
    family = `'${QW.fields.localFontName.trim()}', 'QW98Sans', sans-serif`
  } else if (QW.fields.fontSource === 'google' && QW.fields.googleFont.trim()) {
    family = `'${QW.fields.googleFont.trim()}', 'QW98Sans', sans-serif`
  }
  root.style.setProperty('--qw-font-family', family)
}

// --- 7TV emotes --------------------------------------------------------
// StreamElements' own message event already includes Twitch/FFZ/BTTV emotes
// (see parseMessage below), but never 7TV - so it needs its own fetch-and-map
// step here, run once at load.

const SEVENTV = {
  globalUrl: 'https://7tv.io/v3/emote-sets/global',
  channelUrl: twitchId => `https://7tv.io/v3/users/twitch/${twitchId}`,
}

// Flattens a 7TV emote-set API response into a simple name -> image-urls map.
function sevenTVSetToMap(emoteSet) {
  const out = {}
  const emotes = (emoteSet && emoteSet.emotes) || []
  for (const emote of emotes) {
    const host = emote.data && emote.data.host
    if (!emote.name || !host) continue
    const base = host.url.startsWith('http') ? host.url : `https:${host.url}`
    const files = host.files || []
    const fileFor = size => {
      const match = files.find(f => f.name === `${size}x.webp` && f.format === 'WEBP')
      return match ? `${base}/${match.name}` : `${base}/${size}x.webp`
    }
    out[emote.name] = { urls: { 1: fileFor(1), 2: fileFor(2), 4: fileFor(4) } }
  }
  return out
}

// Loads the global 7TV emote set plus this channel's own set, merging both
// into QW.sevenTV. channel.providerId/id/_id are checked in order since the
// field StreamElements actually populates isn't consistent.
async function loadSevenTVEmotes() {
  const globalSet = await fetchJson(SEVENTV.globalUrl)
  if (globalSet) Object.assign(QW.sevenTV, sevenTVSetToMap(globalSet))

  const twitchId = QW.channel.providerId || QW.channel.id || QW.channel._id
  if (twitchId) {
    const user = await fetchJson(SEVENTV.channelUrl(twitchId))
    if (user && user.emote_set) Object.assign(QW.sevenTV, sevenTVSetToMap(user.emote_set))
  }
}

// StreamElements fires this once when the widget loads, handing over the
// current field values and channel info. Preview Mode's continuous message
// loop only starts if both the field is on AND we're in the SE editor
// (isEditorMode) - it never runs once the widget is actually live.
window.addEventListener('onWidgetLoad', async obj => {
  QW.channel = obj.detail.channel
  readFields(obj.detail.fieldData)
  applyColorPreset()
  applyFontSource()

  await loadSevenTVEmotes()

  const { isEditorMode } = await SE_API.getOverlayStatus()
  toggleClass('qw-preview', QW.fields.previewMode && isEditorMode)
  toggleClass('qw-list', QW.fields.positionMode === 'list')
  toggleClass(`qw-dir-${QW.fields.listDirection}`, QW.fields.positionMode === 'list')
  toggleClass('qw-fixed-width', QW.fields.fixedWidth)

  if (QW.fields.pronounsMode !== 'off') await loadPronounNames()
  if (QW.fields.previewMode && isEditorMode) sendPreviewMessages(1200)
})

// StreamElements sends every field value as a string, even for dropdown
// booleans ("true"/"false"). This coerces the known boolean fields into
// real booleans, and splits the comma-separated list fields into arrays,
// so the rest of the code can just use them directly.
function readFields(raw) {
  QW.fields = raw

  const boolFields = [
    'includeEveryone', 'includeSubs', 'includeVIPs', 'includeMods',
    'previewMode', 'largeEmotes', 'fixedWidth',
    'pronounsLowercase', 'customPronounColors',
    'topEdge', 'bottomEdge', 'leftEdge', 'rightEdge',
  ]
  for (const key of boolFields) QW.fields[key] = raw[key] === 'true'

  const listFields = ['ignoreUsers', 'ignorePrefixes', 'allowUsers']
  for (const key of listFields) QW.fields[key] = toList(raw[key])
}

// StreamElements' event feed: real chat messages, moderation deletes, and
// the Send Test Message button (routed through handleTestButton below).
window.addEventListener('onEventReceived', obj => {
  const { listener, event } = obj.detail
  if (listener === 'message') handleMessage(event)
  else if (listener === 'delete-message') removeWindow(event.msgId)
  else if (listener === 'delete-messages') removeWindowsForUser(event.userId)
  else if (listener === 'event:test') handleTestButton(event)
})

// Filters button-click events down to just this widget's own Send Test
// Message button (event.value is a unique string per widget, since multiple
// button-widgets could share an overlay) before firing a test burst.
function handleTestButton(event) {
  if (event.listener !== 'widget-button' || event.value !== 'qntmos_windowchat') return
  if (event.field !== 'testMessageButton') return
  sendTestBurst()
}

// Fires a handful of fake messages in quick succession, using the same
// PREVIEW_NAMES/PREVIEW_TEXTS pool as Preview Mode (see near the bottom of
// this file), so you can check layout without waiting on real chat.
function sendTestBurst(count = 3, gap = 400) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const name = PREVIEW_NAMES[randomInt(0, PREVIEW_NAMES.length - 1)]
      const text = PREVIEW_TEXTS[randomInt(0, PREVIEW_TEXTS.length - 1)]
      handleMessage({
        data: {
          userId: name, nick: name.toLowerCase(), displayName: name,
          text, emotes: [], badges: [], tags: {},
          msgId: `${name}_${Date.now()}`,
        },
      }, true)
    }, i * gap)
  }
}

// The core message pipeline: filters out ignored users/prefixes/roles, parses
// emotes, resolves a pronoun if enabled, builds the window's HTML, and inserts
// it into the DOM (at the start or end depending on List Direction) before
// handing off to scheduleReveal() for the entrance animation/positioning.
function handleMessage(event, isPreview = false) {
  const data = event.data
  const {
    userId = '', nick: username = '', displayName = '', badges = [],
    text: rawText = '', emotes: rawEmotes = [],
  } = data
  let { displayColor: color } = data

  if (startsWithIgnoredPrefix(rawText)) return
  if (matchesUserList(QW.fields.ignoreUsers, displayName, username)) return
  if (QW.fields.allowUsers.length && !matchesUserList(QW.fields.allowUsers, displayName, username)) return
  if (!isPermittedUserLevel(badges)) return

  const messageType = data.isAction ? 'action'
    : (data.tags && data.tags['msg-id'] === 'highlighted-message') ? 'highlight'
    : 'default'

  const parsed = parseMessage(htmlEscape(rawText), rawEmotes)
  const emoteSize = sizeForContent(parsed)

  let pronoun = null
  if (QW.fields.pronounsMode !== 'off') {
    // Preview/test messages use fake usernames that won't resolve against
    // the real pronoun API, so they get a random pronoun instead - see
    // randomPronoun() below.
    pronoun = isPreview ? randomPronoun() : resolveCachedPronoun(username)
  }

  const msgId = data.msgId || `${username}_${Date.now()}`
  const windowHtml = buildWindowHtml({
    parsed, name: displayName || username, emoteSize, messageType,
    msgId, userId, color, badges, pronoun,
  })

  const main = document.querySelector('main')
  if (QW.fields.positionMode === 'list') main.insertAdjacentHTML('afterbegin', windowHtml)
  else main.insertAdjacentHTML('beforeend', windowHtml)

  scheduleReveal(msgId)
}

// --- Pronouns ------------------------------------------------------------
// Resolved from pronouns.alejo.io, where viewers set their own pronoun -
// this widget only displays it, never configures it. Lookups are cached in
// memory per session so the same viewer isn't re-fetched on every message.

// Returns a cached pronoun if we have a fresh one; otherwise kicks off an
// async lookup for next time and returns null for this message. This keeps
// handleMessage() synchronous rather than making every message wait on a
// network round-trip.
function resolveCachedPronoun(username) {
  const cached = QW.pronounCache[username.toLowerCase()]
  if (cached && cached.expiresAt > Date.now()) return QW.pronounNames[cached.id] || null
  getPronounAsync(username) // fire and forget; updates cache for next message
  return null
}

async function getPronounAsync(username) {
  const lower = username.toLowerCase()
  const res = await fetchJson(`https://pronouns.alejo.io/api/users/${lower}`)
  const entry = res && res[0]
  if (entry) {
    QW.pronounCache[lower] = { id: entry.pronoun_id, expiresAt: Date.now() + 5 * 60 * 1000 }
  }
}

// Loads the full display-name list once at startup (e.g. "she" -> "she/her"),
// used both to render a resolved pronoun ID and to pick a random one for previews.
async function loadPronounNames() {
  const list = await fetchJson('https://pronouns.alejo.io/api/pronouns')
  if (list) for (const p of list) QW.pronounNames[p.name] = p.display
}

function randomPronoun() {
  const keys = Object.keys(QW.pronounNames)
  if (!keys.length) return null
  return QW.pronounNames[keys[Math.floor(Math.random() * keys.length)]]
}

// Assembles one message window's HTML: title bar (badges, pronoun, name),
// and the message panel (parsed text/emotes). resolvedColor falls back to a
// deterministic per-name color when the chat message didn't carry one.
function buildWindowHtml({ parsed, name, emoteSize, messageType, msgId, userId, color, badges, pronoun }) {
  const resolvedColor = color || colorFromName(name)
  let displayName = name
  if (QW.fields.pronounsMode === 'suffix' && pronoun) {
    displayName = `${name} (${QW.fields.pronounsLowercase ? pronoun.toLowerCase() : pronoun})`
  }

  const classes = ['qw-window', `qw-emotesize-${QW.fields.largeEmotes ? emoteSize : 1}`]
  if (messageType === 'highlight' && QW.fields.highlightStyle === 'rainbow') classes.push('qw-highlight')
  if (messageType === 'action' && QW.fields.actionStyle === 'italics') classes.push('qw-action')

  const badgeHtml = badges.map(b => `<img class="qw-badge" src="${b.url}" alt="${b.type}">`).join('')

  const pronounHtml = (QW.fields.pronounsMode === 'badge' && pronoun)
    ? `<span class="qw-pronoun${QW.fields.customPronounColors ? ' qw-pronoun-custom' : ''}">${QW.fields.pronounsLowercase ? pronoun.toLowerCase() : pronoun}</span>`
    : ''

  const contentHtml = parsed.map(part =>
    part.type === 'emote'
      ? `<img class="qw-emote" src="${emoteUrl(part.data)}" alt="${part.data.name}">`
      : `<span class="qw-text">${part.data}</span>`
  ).join('')

  return `
    <section class="${classes.join(' ')}" style="--qw-user-color: ${resolvedColor}"
             data-message-id="${msgId}" data-user-id="${userId}">
      <div class="qw-titlebar">
        <span class="qw-titletext">${badgeHtml}${pronounHtml}${escapeHtml(displayName)}</span>
        <div class="qw-titlebar-buttons">
          <button aria-label="Minimize">${SVG_MIN}</button>
          <button aria-label="Maximize">${SVG_MAX}</button>
          <button aria-label="Close">${SVG_CLOSE}</button>
        </div>
      </div>
      <div class="qw-panel">${contentHtml}</div>
    </section>
  `
}

const SVG_MIN = '<svg viewBox="0 0 15 15"><rect y="13" width="15" height="2"/></svg>'
const SVG_MAX = '<svg viewBox="0 0 15 15"><rect width="15" height="4"/><rect y="13" width="15" height="2"/><rect width="2" height="15"/><rect x="13" width="2" height="15"/></svg>'
const SVG_CLOSE = '<svg viewBox="0 0 15 15"><polygon points="11 6 11 4 13 4 13 2 15 2 15 0 11 0 11 2 9 2 9 4 6 4 6 2 4 2 4 0 0 0 0 2 2 2 2 4 4 4 4 6 6 6 6 9 4 9 4 11 2 11 2 13 0 13 0 15 4 15 4 13 6 13 6 11 9 11 9 13 11 13 11 15 15 15 15 13 13 13 13 11 11 11 11 9 9 9 9 6 11 6"/></svg>'

// Delays a new window becoming visible (and, for floating modes, positioned)
// by the Delay Before Visible field. Building the element immediately but
// keeping it hidden until then means list-mode layout order is already
// correct by the time it reveals.
function scheduleReveal(msgId) {
  const el = document.querySelector(`.qw-window[data-message-id="${msgId}"]`)
  if (!el) return

  setTimeout(() => {
    if (QW.fields.positionMode !== 'list') positionFloatingWindow(el)
    el.classList.add('qw-visible')
    if (QW.fields.animation !== 'none') el.classList.add(`qw-anim-${QW.fields.animation}`)
    QW.messageCount++
    enforceMaxWindows()
    if (QW.fields.lifetime > 0) {
      setTimeout(() => removeWindow(msgId), QW.fields.lifetime * 1000)
    }
  }, QW.fields.delay * 1000)
}

// Places a window at a random spot within the canvas (Random mode), or
// hands off to positionAlongEdge() for Random Along Edges mode.
function positionFloatingWindow(el) {
  if (QW.fields.positionMode === 'random-edge') {
    positionAlongEdge(el)
    return
  }

  const main = document.querySelector('main')
  const w = el.offsetWidth || 250
  const h = el.offsetHeight || 80
  const pad = QW.fields.padding
  const maxX = Math.max(pad, main.clientWidth - pad - w)
  const maxY = Math.max(pad, main.clientHeight - pad - h)
  el.style.left = `${randomInt(pad, maxX)}px`
  el.style.top = `${randomInt(pad, maxY)}px`
}

// Picks a random enabled edge (top/bottom/left/right) and places the window
// along it, offset by up to Edge Deviation px. Falls back to fully random
// placement if no edges are enabled.
function positionAlongEdge(el) {
  const main = document.querySelector('main')
  const w = el.offsetWidth || 250
  const h = el.offsetHeight || 80
  const pad = QW.fields.padding
  const deviation = randomInt(0, QW.fields.edgeDeviation)

  const maxX = Math.max(pad, main.clientWidth - pad - w)
  const maxY = Math.max(pad, main.clientHeight - pad - h)
  const randomX = randomInt(pad, maxX)
  const randomY = randomInt(pad, maxY)

  const candidates = []
  if (QW.fields.topEdge) candidates.push({ top: pad + deviation, left: randomX })
  if (QW.fields.bottomEdge) candidates.push({ bottom: pad + deviation, left: randomX })
  if (QW.fields.leftEdge) candidates.push({ left: pad + deviation, top: randomY })
  if (QW.fields.rightEdge) candidates.push({ right: pad + deviation, top: randomY })

  const chosen = candidates.length
    ? candidates[randomInt(0, candidates.length - 1)]
    : { left: randomX, top: randomY } // no edges enabled - fall back to fully random

  el.style.left = ''
  el.style.top = ''
  el.style.right = ''
  el.style.bottom = ''
  for (const [side, value] of Object.entries(chosen)) {
    el.style[side] = `${value}px`
  }
}

// Evicts the oldest window once Max windows on screen at once is exceeded.
// "Oldest" is the last element for List mode (new ones are inserted at the
// front) and the first element otherwise.
function enforceMaxWindows() {
  if (!QW.fields.maxMessages || QW.messageCount <= QW.fields.maxMessages) return
  const all = document.querySelectorAll('.qw-window:not(.qw-leaving)')
  const oldest = QW.fields.positionMode === 'list' ? all[all.length - 1] : all[0]
  if (oldest) fadeAndRemove(oldest)
}

function removeWindow(msgId) {
  document.querySelectorAll(`.qw-window[data-message-id="${msgId}"]`).forEach(fadeAndRemove)
}

// Handles StreamElements' "delete all messages from this user" moderation
// event - with no userId (a full chat clear) it removes every window instead.
function removeWindowsForUser(userId) {
  if (!userId) {
    document.querySelectorAll('.qw-window').forEach(fadeAndRemove)
    QW.messageCount = 0
    return
  }
  document.querySelectorAll(`.qw-window[data-user-id="${userId}"]`).forEach(fadeAndRemove)
}

function fadeAndRemove(el) {
  if (el.classList.contains('qw-leaving')) return
  QW.messageCount--
  el.classList.add('qw-leaving')
  setTimeout(() => el.remove(), 400) // matches the qw-fade-out animation duration in widget.css
}

// Splits a message into alternating text/emote parts for rendering. Twitch's
// own emotes arrive pre-located in twitchEmotes (along with FFZ/BTTV, which
// StreamElements folds into the same array), but 7TV never does, so it's
// matched here by scanning the raw text for whole-word occurrences of any
// known 7TV emote name before everything gets combined and split.
function parseMessage(text, twitchEmotes) {
  const combined = [...twitchEmotes]

  for (const name of Object.keys(QW.sevenTV)) {
    let index = text.indexOf(name)
    while (index !== -1) {
      const before = text[index - 1]
      const after = text[index + name.length]
      if ((!before || /\s/.test(before)) && (!after || /\s/.test(after))) {
        combined.push({ provider: 'sevenTV', name, start: index, end: index + name.length - 1 })
      }
      index = text.indexOf(name, index + 1)
    }
  }

  const active = combined.filter(e =>
    e.provider === 'sevenTV' || ['twitch', 'ffz', 'bttv', 'sticker'].includes(e.type)
  )

  if (active.length === 0) return [{ type: 'text', data: text }]

  const escapedNames = active.map(e => e.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
  const regex = new RegExp(`(?<=\\s|^)(?:${escapedNames.sort((a, b) => b.length - a.length).join('|')})(?=\\s|$|[.,!])`, 'g')

  const textChunks = text.split(regex)
  const last = textChunks.pop()
  const parts = []
  textChunks.forEach((chunk, i) => {
    parts.push({ type: 'text', data: chunk })
    parts.push({ type: 'emote', data: active[i] })
  })
  parts.push({ type: 'text', data: last })
  return parts
}

// Resolves the actual image URL for one parsed emote part - 7TV uses its own
// map (built by loadSevenTVEmotes), native Twitch emotes are built from the
// emote ID, and everything else (FFZ/BTTV) already carries a urls object.
function emoteUrl(emote) {
  if (emote.provider === 'sevenTV') return QW.sevenTV[emote.name].urls[4]
  if (emote.type === 'twitch') {
    return `https://static-cdn.jtvnw.net/emoticons/v2/${emote.id}/default/light/3.0`
  }
  return emote.urls?.[4] || emote.urls?.[2] || emote.urls?.[1]
}

// Determines the emote size class for a message: real text present = normal
// inline size, a single emote with no text = biggest, multiple emotes with
// no text = medium. Only applies when Larger Emotes for Emote-Only Messages
// is on - see buildWindowHtml above.
function sizeForContent(parts) {
  let emoteCount = 0
  for (const part of parts) {
    if (part.type === 'emote') emoteCount++
    else if (part.data.trim() !== '') return 1
  }
  return emoteCount > 1 ? 2 : 4
}

function hasBadge(badges, ...types) {
  return badges.some(b => types.includes(b.type))
}

// Shared pool of placeholder names/messages for both Preview Mode and Send
// Test Message - deliberately includes a long message (wrapping test), a
// short one, and a name with a space in it.
const PREVIEW_NAMES = [
  'Quantumtherobot', 'mocchipinku', 'coolviewer123', 'notAbot', 'gamer', 'wintonOverwatch',
]

const PREVIEW_TEXTS = [
  'HYPE',
  'this is a very long message specifically designed to test if the chat doesnt break when someone sends a long message, if it doesnt this should look fine',
  'gg well played',
  'Hello chat',
  'are we live?',
  'Jarvis, clip that',
  'this is chat is very cool whoever designed must be cool and handsome',
]

// Preview Mode's continuous loop - only ever started from onWidgetLoad when
// both the field is on and we're in the StreamElements editor (never live).
// Keeps rescheduling itself via setTimeout rather than setInterval so it can
// check QW.fields.previewMode fresh each tick and stop cleanly if turned off.
function sendPreviewMessages(gap) {
  const tick = () => {
    if (!QW.fields.previewMode) return
    const name = PREVIEW_NAMES[randomInt(0, PREVIEW_NAMES.length - 1)]
    const text = PREVIEW_TEXTS[randomInt(0, PREVIEW_TEXTS.length - 1)]
    handleMessage({
      data: {
        userId: name, nick: name.toLowerCase(), displayName: name,
        text, emotes: [], badges: [], tags: {},
        msgId: `${name}_${Date.now()}`,
      },
    }, true)
    setTimeout(tick, gap)
  }
  tick()
}

async function fetchJson(url) {
  try {
    const res = await fetch(url)
    return res.ok ? await res.json() : null
  } catch {
    return null
  }
}

function toList(str = '') {
  return str.split(',').map(s => s.trim()).filter(Boolean)
}

function matchesUserList(list, ...names) {
  const lower = names.map(n => (n || '').toLowerCase())
  return list.some(u => lower.includes(u.toLowerCase()))
}

function startsWithIgnoredPrefix(text) {
  return QW.fields.ignorePrefixes.some(p => text.startsWith(p))
}

// Everyone passes if Show Messages From Everyone is on. Otherwise the
// chatter needs a matching badge - broadcaster always passes regardless of
// the other toggles.
function isPermittedUserLevel(badges) {
  if (QW.fields.includeEveryone) return true
  if (!badges.length) return false
  const allowed = ['broadcaster']
  if (QW.fields.includeSubs) allowed.push('subscriber', 'founder')
  if (QW.fields.includeVIPs) allowed.push('vip')
  if (QW.fields.includeMods) allowed.push('moderator')
  return hasBadge(badges, ...allowed)
}

// Deterministic fallback color for chatters whose message didn't carry a
// Twitch display color - same name always maps to the same color.
function colorFromName(name) {
  const palette = ['#FF4A80', '#FF7070', '#FA8E4B', '#FEE440', '#5FFF77', '#00F5D4', '#00BBF9', '#4371FB', '#9B5DE5', '#F670DD']
  const sum = [...(name || '')].reduce((acc, ch) => acc + ch.charCodeAt(0), 0)
  return palette[sum % palette.length]
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min
}

function toggleClass(name, condition) {
  document.querySelector('main').classList.toggle(name, !!condition)
}

// Escapes viewer-supplied text before it's inserted as HTML, so a chatter
// can't break the layout (or inject markup) with their username or message.
function htmlEscape(text) {
  return text.replace(/[<>"'^=]/g, ch => `&#${ch.charCodeAt(0)};`)
}

function escapeHtml(text) {
  return htmlEscape(text)
}

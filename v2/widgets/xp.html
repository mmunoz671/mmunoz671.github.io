<title>Quantumtherobot XP Window Chat - preview</title>
<style>
/* Preview frame: fixed 800x450 canvas on a neutral background.
   Change --preview-bg to "transparent" for a see-through background. */
:root { --preview-bg: #3a3a3a; }
html, body { margin: 0; padding: 0; }
body { position: relative; width: 800px; height: 450px; overflow: hidden; }
/* Windows XP "Luna" chrome for the default Blue preset (see data-preset below). */
html[data-preset="xpBlue"] .qxp-window { border-color: #0831D9; box-shadow: 0 3px 10px rgba(0, 19, 140, .45); }
html[data-preset="xpBlue"] .qxp-titlebar {
  background: linear-gradient(180deg, #0997FF, #0053EE 8%, #0050EE 40%, #0066FF 88%, #0066FF 93%, #005BFF 95%, #003DD7 96%, #003DD7);
  text-shadow: 1px 1px #0F1089;
}
html[data-preset="xpBlue"] .qxp-titlebar::before { display: none; }
html[data-preset="xpBlue"] .qxp-titlebar-buttons button {
  border: 1px solid #FFFFFF;
  background: radial-gradient(circle at 90% 90%, #0054E9 0%, #2263D5 55%, #4479E4 70%, #A3BBEC 90%, #FFFFFF 100%);
  box-shadow: inset 0 -1px 2px 1px #4646FF;
  color: #FFFFFF;
}
html[data-preset="xpBlue"] .qxp-titlebar-buttons button.qxp-btn-close {
  background: radial-gradient(circle at 90% 90%, #CC4600 0%, #DC6527 55%, #CD7546 70%, #FFCCB2 90%, #FFFFFF 100%);
  box-shadow: inset 0 -1px 2px 1px #DA4600;
}
/* Separate backdrop element: widgets force html/body transparent for OBS. */
#preview-backdrop { position: fixed; left: 0; top: 0; width: 800px; height: 450px; z-index: -1; background: var(--preview-bg); }
</style>
<style id="hide-editor-overlay">
main.qxp-preview::before, main.qxp-preview::after { display: none !important; }
</style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  overflow-wrap: break-word;
  font-family: var(--qxp-font-family, 'QXPNotoSans', 'Segoe UI', Tahoma, sans-serif);
  /* CEF (the Chromium build OBS's Browser Source runs on) can rasterize the
     same embedded web font more roughly than a full desktop browser. These
     two properties are the standard normalization for that gap - they don't
     change which font is used, only how smoothly it gets drawn. */
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* main fills the entire overlay canvas. All the --qxp-* custom properties
   below are the widget's live color palette. */
main {
  position: absolute;
  inset: 0;
  font-size: 15px;
  font-weight: normal;

  /* these get overridden at runtime by widget.js when a color
     preset other than "custom" is picked in the fields panel */
  --qxp-title-1: #3D95FF;
  --qxp-title-2: #0050EE;
  --qxp-title-angle: 180deg;
  --qxp-title-text: #FFFFFF;

  --qxp-face-1: #0A64C2;
  --qxp-face-2: #0A3D91;

  --qxp-bevel-hi: #FFFFFF;
  --qxp-bevel-lo: #001B4D;

  --qxp-panel-bg: #FFFFFF;
  --qxp-panel-text: #14243D;

  --qxp-btn-bg: #2C7FE0;
  --qxp-btn-icon: #FFFFFF;
}

/* List mode uses real flexbox with margin-based spacing between windows
   (see the qxp-dir-x / margin rules further down), not forced overlap. */
main.qxp-list {
  display: flex;
  padding: 30px;
  align-items: flex-end;
}

main.qxp-dir-bottom { flex-direction: column-reverse; }
main.qxp-dir-top { flex-direction: column; }
main.qxp-dir-left { flex-direction: row; }
main.qxp-dir-right { flex-direction: row-reverse; }

/* Editor-only overlay shown when Preview Mode is on and you're in the
   StreamElements editor (see the JS's onWidgetLoad) - a dashed border plus
   the message below, so it's obvious the widget isn't broken, it's just
   demoing itself. Both pieces are pure CSS, toggled by the qxp-preview class. */
main.qxp-preview::before {
  content: '';
  position: absolute;
  inset: 30px;
  border: 8px dashed #fff;
  box-shadow: 0 0 6px #000;
  background: #0007;
  z-index: -20;
}

main.qxp-preview::after {
  content: 'Preview Mode is on \a Turn it off in fields once you are done editing.';
  white-space: pre-wrap;
  position: absolute;
  inset: 30px;
  padding: 24px;
  color: #fff;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 0 0 4px #000, 0 0 2px #000;
  background: #000a;
  z-index: -10;
}

.qxp-spacer { flex: 1; }

/* One chat message window. Border/shadow use the accent color, but unlike
   the W98 widget there's no gradient fill on the window itself - the panel
   below carries its own background, matching real XP's look of a themed
   border around a plain white content area.
   flex-shrink: 0 is required here: in List mode the container is a
   fixed-height flexbox, so without this the browser would proportionally
   shrink windows to force-fit them once total height exceeds the canvas. */
.qxp-window {
  position: absolute;
  visibility: hidden;
  width: fit-content;
  max-width: calc(400px + 6px);
  flex-shrink: 0;
  border-radius: 7px 7px 4px 4px;
  border: 3px solid var(--qxp-face-2);
  box-shadow: 0 3px 10px color-mix(in srgb, var(--qxp-bevel-lo) 55%, transparent);
  overflow: hidden;
}

main.qxp-fixed-width .qxp-window {
  width: calc(400px + 6px);
}

main.qxp-list .qxp-window { position: relative; }

main.qxp-dir-top .qxp-window { margin-bottom: 15px; }
main.qxp-dir-bottom .qxp-window { margin-top: 15px; }
main.qxp-dir-left .qxp-window { margin-right: 15px; }
main.qxp-dir-right .qxp-window { margin-left: 15px; }

.qxp-window.qxp-visible { visibility: visible; }

/* Rainbow effect for Twitch "Highlight My Message" when Highlighted Message
   Style is set to Rainbow - see the qxp-highlight class added in the JS. */
.qxp-window.qxp-highlight .qxp-titlebar {
  animation: qxp-rainbow 6s linear infinite;
}

.qxp-titlebar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 4px 4px 7px;
  background: linear-gradient(var(--qxp-title-angle), var(--qxp-title-1), var(--qxp-title-2));
  color: var(--qxp-title-text);
  font-weight: bold;
  font-size: .95em;
  text-shadow: 0 1px 1px rgba(0, 0, 0, .35);
  white-space: nowrap;
}

/* The soft light-to-transparent gradient overlay that gives the title bar
   its glossy "Luna" look, covering roughly the top half. */
.qxp-titlebar::before {
  content: '';
  position: absolute;
  inset: 0 0 55% 0;
  background: linear-gradient(
    to bottom,
    color-mix(in srgb, var(--qxp-bevel-hi) 45%, transparent),
    transparent
  );
  pointer-events: none;
}

.qxp-titletext {
  position: relative;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 3px;
}

.qxp-badge {
  height: 0.75rem;
  vertical-align: middle;
}

.qxp-pronoun {
  border: 1px solid currentcolor;
  border-radius: 3px;
  font-size: .68rem;
  font-weight: normal;
  padding: 0 3px;
}

.qxp-pronoun.qxp-pronoun-custom {
  color: #FFFFFF;
  background: #000000;
  border-color: #FFFFFF;
}

.qxp-titlebar-buttons {
  position: relative;
  display: flex;
  gap: 2px;
  margin-left: auto;
}

/* Minimize/maximize are visual only - purely decorative, matching a real
   window's title bar chrome. */
.qxp-titlebar-buttons button {
  width: 20px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  border: 1px solid rgba(0, 0, 0, .45);
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--qxp-btn-bg) 60%, white),
    var(--qxp-btn-bg)
  );
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
  color: var(--qxp-btn-icon);
  padding: 0;
}

/* The close button is always this red gradient regardless of color preset -
   matches every real Windows XP theme, which never re-colored Close. */
.qxp-titlebar-buttons button.qxp-btn-close {
  background: linear-gradient(180deg, #FF8478, #DA3B2A);
  color: #FFFFFF;
}

.qxp-icon {
  width: 9px;
  height: 9px;
}

/* The actual message text/emotes live here, in a plain panel below the
   themed title bar/border - real XP dialogs kept the content area neutral
   regardless of accent color, unlike the title bar. */
.qxp-panel {
  background: var(--qxp-panel-bg);
  color: var(--qxp-panel-text);
  border-top: 1px solid rgba(0, 0, 0, .12);
  padding: 6px 8px;
  max-width: 400px;
  direction: ltr;
}

.qxp-window.qxp-action .qxp-text { font-style: italic; }
.qxp-window.qxp-action .qxp-emote { transform: skew(-5deg); }

.qxp-emote {
  vertical-align: middle;
  margin: -3px 0;
}

.qxp-emotesize-1 .qxp-emote { height: 1.7rem; }
.qxp-emotesize-2 .qxp-emote { height: 3.4rem; }
.qxp-emotesize-4 .qxp-emote { height: 6.5rem; }

/* Entrance animation classes - the JS adds one of these based on the
   Entrance Animation field. qxp-leaving (below) plays on the way out,
   always the same fade regardless of which entrance animation was used. */
.qxp-anim-pop { animation: qxp-pop-in .35s ease-out; }
.qxp-anim-fade { animation: qxp-fade-in .35s ease-out; }
.qxp-anim-fade-up { animation: qxp-fade-in .35s ease-out, qxp-slide-up .35s ease-out; }
.qxp-anim-fade-down { animation: qxp-fade-in .35s ease-out, qxp-slide-down .35s ease-out; }
.qxp-anim-fade-left { animation: qxp-fade-in .35s ease-out, qxp-slide-left .35s ease-out; }
.qxp-anim-fade-right { animation: qxp-fade-in .35s ease-out, qxp-slide-right .35s ease-out; }

.qxp-window.qxp-leaving {
  animation: qxp-fade-out .4s ease-in forwards;
}

@keyframes qxp-pop-in {
  0% { transform: scale(.6); opacity: 0; }
  70% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes qxp-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes qxp-fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes qxp-slide-up { from { transform: translateY(40px); } to { transform: translateY(0); } }
@keyframes qxp-slide-down { from { transform: translateY(-40px); } to { transform: translateY(0); } }
@keyframes qxp-slide-left { from { transform: translateX(40px); } to { transform: translateX(0); } }
@keyframes qxp-slide-right { from { transform: translateX(-40px); } to { transform: translateX(0); } }
@keyframes qxp-rainbow {
  0%   { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

<script>
// Quantumtherobot XP Window Chat - original widget by Quantumtherobot

// Runtime state: current field values, channel info, how many message
// windows are currently on screen, and caches for pronoun/7TV lookups.
const QXP = {
  fields: {},
  channel: {},
  messageCount: 0,
  pronounNames: {},
  pronounCache: {},
  globalEmotes: {},
  sevenTV: {},
}

// Named color palettes. Each maps directly onto the CSS custom properties

// below just copies these onto the DOM when a named preset (not "Custom") is picked.
const QXP_PALETTES = {
  xpBlue: {

    '--qxp-btn-bg': '#2C7FE0', '--qxp-btn-icon': '#FFFFFF',

    '--qxp-face-1': '#7C8F49', '--qxp-face-2': '#4B5A28',
    '--qxp-bevel-hi': '#FFFFFF', '--qxp-bevel-lo': '#223016',
    '--qxp-panel-bg': '#FFFFFF', '--qxp-panel-text': '#22301A',
    '--qxp-btn-bg': '#7C8F49', '--qxp-btn-icon': '#FFFFFF',
  },
  xpSilver: {

    '--qxp-face-1': '#85858F', '--qxp-face-2': '#4E4E58',
    '--qxp-bevel-hi': '#FFFFFF', '--qxp-bevel-lo': '#232329',
    '--qxp-panel-bg': '#FFFFFF', '--qxp-panel-text': '#202024',
    '--qxp-btn-bg': '#85858F', '--qxp-btn-icon': '#FFFFFF',
  },
  royale: {
    '--qxp-title-1': '#3A3A42', '--qxp-title-2': '#0E0E12', '--qxp-title-text': '#FFFFFF',
    '--qxp-face-1': '#232328', '--qxp-face-2': '#0A0A0D',

    '--qxp-panel-bg': '#17171B', '--qxp-panel-text': '#E4E4EA',

  },
  sunset: {
    '--qxp-title-1': '#FF3D9A', '--qxp-title-2': '#FF8A3D', '--qxp-title-text': '#FFFFFF',
    '--qxp-face-1': '#D6007F', '--qxp-face-2': '#E65C00',
    '--qxp-bevel-hi': '#FFFFFF', '--qxp-bevel-lo': '#4A0026',
    '--qxp-panel-bg': '#FFFFFF', '--qxp-panel-text': '#3A0A20',
    '--qxp-btn-bg': '#D6007F', '--qxp-btn-icon': '#FFFFFF',
  },
  qntmos: {
    '--qxp-title-1': '#30E8E8', '--qxp-title-2': '#8D6CAA', '--qxp-title-text': '#1F4496',
    '--qxp-face-1': '#2B68CF', '--qxp-face-2': '#5C45D5',
    '--qxp-bevel-hi': '#30E893', '--qxp-bevel-lo': '#000000',
    '--qxp-panel-bg': '#FFFFFF', '--qxp-panel-text': '#1A1A3A',
    '--qxp-btn-bg': '#2B68CF', '--qxp-btn-icon': '#30E8E8',
  },
}

// Copies the chosen preset's colors onto the widget's CSS custom properties.
// If Color Preset is set to "Custom", there's no matching entry here, so this
// is a no-op and the field-driven --qxp-* values from widget.css just apply as-is.
function applyColorPreset() {
  const preset = QXP_PALETTES[QXP.fields.colorPreset]
  if (!preset) return // "custom" -> leave the field-driven CSS variables alone
  const root = document.querySelector('main')
  for (const [prop, value] of Object.entries(preset)) {
    root.style.setProperty(prop, value)
  }
}

// Resolves the Font Source field (built-in/local/google) into an actual
// font-family stack and writes it to --qxp-font-family, which widget.css reads.
function applyFontSource() {
  const root = document.querySelector('main')
  let family = `'QXPNotoSans', 'Segoe UI', Tahoma, sans-serif`
  if (QXP.fields.fontSource === 'local' && QXP.fields.localFontName.trim()) {
    family = `'${QXP.fields.localFontName.trim()}', 'QXPNotoSans', sans-serif`
  } else if (QXP.fields.fontSource === 'google' && QXP.fields.googleFont.trim()) {
    family = `'${QXP.fields.googleFont.trim()}', 'QXPNotoSans', sans-serif`
  }
  root.style.setProperty('--qxp-font-family', family)
}

// --- 7TV emotes --------------------------------------------------------
// StreamElements' own message event already includes Twitch/FFZ/BTTV emotes
// (see parseMessage below), but never 7TV - so it needs its own fetch-and-map
// step here, run once at load.

const SEVENTV = {
  globalUrl: 'https://7tv.io/v3/emote-sets/global',
  channelUrl: twitchId => `https://7tv.io/v3/users/twitch/${twitchId}`,
}

// Flattens a 7TV emote-set API response into a simple name -> image-urls map.
function sevenTVSetToMap(emoteSet) {
  const out = {}
  const emotes = (emoteSet && emoteSet.emotes) || []
  for (const emote of emotes) {
    const host = emote.data && emote.data.host
    if (!emote.name || !host) continue
    const base = host.url.startsWith('http') ? host.url : `https:${host.url}`
    const files = host.files || []
    const fileFor = size => {
      const match = files.find(f => f.name === `${size}x.webp` && f.format === 'WEBP')
      return match ? `${base}/${match.name}` : `${base}/${size}x.webp`
    }
    out[emote.name] = { urls: { 1: fileFor(1), 2: fileFor(2), 4: fileFor(4) } }
  }
  return out
}

// Loads the global 7TV emote set plus this channel's own set, merging both
// into QXP.sevenTV. channel.providerId/id/_id are checked in order since the
// field StreamElements actually populates isn't consistent.
async function loadSevenTVEmotes() {
  const globalSet = await fetchJson(SEVENTV.globalUrl)
  if (globalSet) Object.assign(QXP.sevenTV, sevenTVSetToMap(globalSet))

  const twitchId = QXP.channel.providerId || QXP.channel.id || QXP.channel._id
  if (twitchId) {
    const user = await fetchJson(SEVENTV.channelUrl(twitchId))
    if (user && user.emote_set) Object.assign(QXP.sevenTV, sevenTVSetToMap(user.emote_set))
  }
}

// StreamElements fires this once when the widget loads, handing over the
// current field values and channel info. Preview Mode's continuous message
// loop only starts if both the field is on AND we're in the SE editor
// (isEditorMode) - it never runs once the widget is actually live.
window.addEventListener('onWidgetLoad', async obj => {
  QXP.channel = obj.detail.channel
  readFields(obj.detail.fieldData)
  applyColorPreset()
  applyFontSource()

  await loadSevenTVEmotes()

  const { isEditorMode } = await SE_API.getOverlayStatus()
  toggleClass('qxp-preview', QXP.fields.previewMode && isEditorMode)
  toggleClass('qxp-list', QXP.fields.positionMode === 'list')
  toggleClass(`qxp-dir-${QXP.fields.listDirection}`, QXP.fields.positionMode === 'list')
  toggleClass('qxp-fixed-width', QXP.fields.fixedWidth)

  if (QXP.fields.pronounsMode !== 'off') await loadPronounNames()
  if (QXP.fields.previewMode && isEditorMode) sendPreviewMessages(1200)
})

// StreamElements sends every field value as a string, even for dropdown
// booleans ("true"/"false"). This coerces the known boolean fields into
// real booleans, and splits the comma-separated list fields into arrays,
// so the rest of the code can just use them directly.
function readFields(raw) {
  QXP.fields = raw

  const boolFields = [
    'includeEveryone', 'includeSubs', 'includeVIPs', 'includeMods',
    'previewMode', 'largeEmotes', 'fixedWidth',
    'pronounsLowercase', 'customPronounColors',
    'topEdge', 'bottomEdge', 'leftEdge', 'rightEdge',
  ]
  for (const key of boolFields) QXP.fields[key] = raw[key] === 'true'

  const listFields = ['ignoreUsers', 'ignorePrefixes', 'allowUsers']
  for (const key of listFields) QXP.fields[key] = toList(raw[key])
}

// StreamElements' event feed: real chat messages, moderation deletes, and
// the Send Test Message button (routed through handleTestButton below).
window.addEventListener('onEventReceived', obj => {
  const { listener, event } = obj.detail
  if (listener === 'message') handleMessage(event)
  else if (listener === 'delete-message') removeWindow(event.msgId)
  else if (listener === 'delete-messages') removeWindowsForUser(event.userId)
  else if (listener === 'event:test') handleTestButton(event)
})

// Filters button-click events down to just this widget's own Send Test
// Message button (event.value is a unique string per widget, since multiple
// button-widgets could share an overlay) before firing a test burst.
function handleTestButton(event) {
  if (event.listener !== 'widget-button' || event.value !== 'qntmos_xpwindowchat') return
  if (event.field !== 'testMessageButton') return
  sendTestBurst()
}

// Fires a handful of fake messages in quick succession, using the same
// PREVIEW_NAMES/PREVIEW_TEXTS pool as Preview Mode (see near the bottom of
// this file), so you can check layout without waiting on real chat.
function sendTestBurst(count = 3, gap = 400) {
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const name = PREVIEW_NAMES[randomInt(0, PREVIEW_NAMES.length - 1)]
      const text = PREVIEW_TEXTS[randomInt(0, PREVIEW_TEXTS.length - 1)]
      handleMessage({
        data: {
          userId: name, nick: name.toLowerCase(), displayName: name,
          text, emotes: [], badges: [], tags: {},
          msgId: `${name}_${Date.now()}`,
        },
      }, true)
    }, i * gap)
  }
}

// The core message pipeline: filters out ignored users/prefixes/roles, parses
// emotes, resolves a pronoun if enabled, builds the window's HTML, and inserts
// it into the DOM (at the start or end depending on List Direction) before
// handing off to scheduleReveal() for the entrance animation/positioning.
function handleMessage(event, isPreview = false) {
  const data = event.data
  const {
    userId = '', nick: username = '', displayName = '', badges = [],
    text: rawText = '', emotes: rawEmotes = [],
  } = data
  let { displayColor: color } = data

  if (startsWithIgnoredPrefix(rawText)) return
  if (QXP.fields.allowUsers.length && !matchesUserList(QXP.fields.allowUsers, displayName, username)) return
  if (matchesUserList(QXP.fields.ignoreUsers, displayName, username)) return
  if (!isPermittedUserLevel(badges)) return

  const messageType = data.isAction ? 'action'
    : (data.tags && data.tags['msg-id'] === 'highlighted-message') ? 'highlight'
    : 'default'

  const parsed = parseMessage(htmlEscape(rawText), rawEmotes)
  const emoteSize = sizeForContent(parsed)

  let pronoun = null
  if (QXP.fields.pronounsMode !== 'off') {
    // Preview/test messages use fake usernames that won't resolve against
    // the real pronoun API, so they get a random pronoun instead - see
    // randomPronoun() below.
    pronoun = isPreview ? randomPronoun() : resolveCachedPronoun(username)
  }

  const msgId = data.msgId || `${username}_${Date.now()}`
  const windowHtml = buildWindowHtml({
    parsed, name: displayName || username, emoteSize, messageType,
    msgId, userId, color, badges, pronoun,
  })

  const main = document.querySelector('main')
  if (QXP.fields.positionMode === 'list') main.insertAdjacentHTML('afterbegin', windowHtml)
  else main.insertAdjacentHTML('beforeend', windowHtml)

  scheduleReveal(msgId)
}

// --- Pronouns ------------------------------------------------------------
// Resolved from pronouns.alejo.io, where viewers set their own pronoun -
// this widget only displays it, never configures it. Lookups are cached in
// memory per session so the same viewer isn't re-fetched on every message.

// Returns a cached pronoun if we have a fresh one; otherwise kicks off an
// async lookup for next time and returns null for this message. This keeps
// handleMessage() synchronous rather than making every message wait on a
// network round-trip.
function resolveCachedPronoun(username) {
  const cached = QXP.pronounCache[username.toLowerCase()]
  if (cached && cached.expiresAt > Date.now()) return QXP.pronounNames[cached.id] || null
  getPronounAsync(username) // fire and forget; updates cache for next message
  return null
}

async function getPronounAsync(username) {
  const lower = username.toLowerCase()
  const res = await fetchJson(`https://pronouns.alejo.io/api/users/${lower}`)
  const entry = res && res[0]
  if (entry) {
    QXP.pronounCache[lower] = { id: entry.pronoun_id, expiresAt: Date.now() + 5 * 60 * 1000 }
  }
}

// Loads the full display-name list once at startup (e.g. "she" -> "she/her"),
// used both to render a resolved pronoun ID and to pick a random one for previews.
async function loadPronounNames() {
  const list = await fetchJson('https://pronouns.alejo.io/api/pronouns')
  if (list) for (const p of list) QXP.pronounNames[p.name] = p.display
}

function randomPronoun() {
  const keys = Object.keys(QXP.pronounNames)
  if (!keys.length) return null
  return QXP.pronounNames[keys[Math.floor(Math.random() * keys.length)]]
}

// Assembles one message window's HTML: title bar (badges, pronoun, name),
// and the message panel (parsed text/emotes). resolvedColor falls back to a
// deterministic per-name color when the chat message didn't carry one.
function buildWindowHtml({ parsed, name, emoteSize, messageType, msgId, userId, color, badges, pronoun }) {
  const resolvedColor = color || colorFromName(name)
  let displayName = name
  if (QXP.fields.pronounsMode === 'suffix' && pronoun) {
    displayName = `${name} (${QXP.fields.pronounsLowercase ? pronoun.toLowerCase() : pronoun})`
  }

  const classes = ['qxp-window', `qxp-emotesize-${QXP.fields.largeEmotes ? emoteSize : 1}`]
  if (messageType === 'highlight' && QXP.fields.highlightStyle === 'rainbow') classes.push('qxp-highlight')
  if (messageType === 'action' && QXP.fields.actionStyle === 'italics') classes.push('qxp-action')

  const badgeHtml = badges.map(b => `<img class="qxp-badge" src="${b.url}" alt="${b.type}">`).join('')

  const pronounHtml = (QXP.fields.pronounsMode === 'badge' && pronoun)
    ? `<span class="qxp-pronoun${QXP.fields.customPronounColors ? ' qxp-pronoun-custom' : ''}">${QXP.fields.pronounsLowercase ? pronoun.toLowerCase() : pronoun}</span>`
    : ''

  const contentHtml = parsed.map(part =>
    part.type === 'emote'
      ? `<img class="qxp-emote" src="${emoteUrl(part.data)}" alt="${part.data.name}">`
      : `<span class="qxp-text">${part.data}</span>`
  ).join('')

  return `
    <section class="${classes.join(' ')}" style="--qxp-user-color: ${resolvedColor}"
             data-message-id="${msgId}" data-user-id="${userId}">
      <div class="qxp-titlebar">
        <span class="qxp-titletext">${badgeHtml}${pronounHtml}${escapeHtml(displayName)}</span>
        <div class="qxp-titlebar-buttons">
          <button aria-label="Minimize">${SVG_MIN}</button>
          <button aria-label="Maximize">${SVG_MAX}</button>
          <button class="qxp-btn-close" aria-label="Close">${SVG_CLOSE}</button>
        </div>
      </div>
      <div class="qxp-panel">${contentHtml}</div>
    </section>
  `
}

const SVG_MIN = '<svg viewBox="0 0 10 10" class="qxp-icon"><rect x="1" y="7" width="8" height="1.6" fill="currentColor"/></svg>'
const SVG_MAX = '<svg viewBox="0 0 10 10" class="qxp-icon"><rect x="1.2" y="1.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>'
const SVG_CLOSE = '<svg viewBox="0 0 10 10" class="qxp-icon"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></g></svg>'

// Delays a new window becoming visible (and, for floating modes, positioned)
// by the Delay Before Visible field. Building the element immediately but
// keeping it hidden until then means list-mode layout order is already
// correct by the time it reveals.
function scheduleReveal(msgId) {
  const el = document.querySelector(`.qxp-window[data-message-id="${msgId}"]`)
  if (!el) return

  setTimeout(() => {
    if (QXP.fields.positionMode !== 'list') positionFloatingWindow(el)
    el.classList.add('qxp-visible')
    if (QXP.fields.animation !== 'none') el.classList.add(`qxp-anim-${QXP.fields.animation}`)
    QXP.messageCount++
    enforceMaxWindows()
    if (QXP.fields.lifetime > 0) {
      setTimeout(() => removeWindow(msgId), QXP.fields.lifetime * 1000)
    }
  }, QXP.fields.delay * 1000)
}

// Places a window at a random spot within the canvas (Random mode), or
// hands off to positionAlongEdge() for Random Along Edges mode.
function positionFloatingWindow(el) {
  if (QXP.fields.positionMode === 'random-edge') {
    positionAlongEdge(el)
    return
  }

  const main = document.querySelector('main')
  const w = el.offsetWidth || 250
  const h = el.offsetHeight || 80
  const pad = QXP.fields.padding
  const maxX = Math.max(pad, main.clientWidth - pad - w)
  const maxY = Math.max(pad, main.clientHeight - pad - h)
  el.style.left = `${randomInt(pad, maxX)}px`
  el.style.top = `${randomInt(pad, maxY)}px`
}

// Picks a random enabled edge (top/bottom/left/right) and places the window
// along it, offset by up to Edge Deviation px. Falls back to fully random
// placement if no edges are enabled.
function positionAlongEdge(el) {
  const main = document.querySelector('main')
  const w = el.offsetWidth || 250
  const h = el.offsetHeight || 80
  const pad = QXP.fields.padding
  const deviation = randomInt(0, QXP.fields.edgeDeviation)

  const maxX = Math.max(pad, main.clientWidth - pad - w)
  const maxY = Math.max(pad, main.clientHeight - pad - h)
  const randomX = randomInt(pad, maxX)
  const randomY = randomInt(pad, maxY)

  const candidates = []
  if (QXP.fields.topEdge) candidates.push({ top: pad + deviation, left: randomX })
  if (QXP.fields.bottomEdge) candidates.push({ bottom: pad + deviation, left: randomX })
  if (QXP.fields.leftEdge) candidates.push({ left: pad + deviation, top: randomY })
  if (QXP.fields.rightEdge) candidates.push({ right: pad + deviation, top: randomY })

  const chosen = candidates.length
    ? candidates[randomInt(0, candidates.length - 1)]
    : { left: randomX, top: randomY } // no edges enabled - fall back to fully random

  el.style.left = ''
  el.style.top = ''
  el.style.right = ''
  el.style.bottom = ''
  for (const [side, value] of Object.entries(chosen)) {
    el.style[side] = `${value}px`
  }
}

// Evicts the oldest window once Max windows on screen at once is exceeded.
// "Oldest" is the last element for List mode (new ones are inserted at the
// front) and the first element otherwise.
function enforceMaxWindows() {
  if (!QXP.fields.maxMessages || QXP.messageCount <= QXP.fields.maxMessages) return
  const all = document.querySelectorAll('.qxp-window:not(.qxp-leaving)')
  const oldest = QXP.fields.positionMode === 'list' ? all[all.length - 1] : all[0]
  if (oldest) fadeAndRemove(oldest)
}

function removeWindow(msgId) {
  document.querySelectorAll(`.qxp-window[data-message-id="${msgId}"]`).forEach(fadeAndRemove)
}

// Handles StreamElements' "delete all messages from this user" moderation
// event - with no userId (a full chat clear) it removes every window instead.
function removeWindowsForUser(userId) {
  if (!userId) {
    document.querySelectorAll('.qxp-window').forEach(fadeAndRemove)
    QXP.messageCount = 0
    return
  }
  document.querySelectorAll(`.qxp-window[data-user-id="${userId}"]`).forEach(fadeAndRemove)
}

function fadeAndRemove(el) {
  if (el.classList.contains('qxp-leaving')) return
  QXP.messageCount--
  el.classList.add('qxp-leaving')
  setTimeout(() => el.remove(), 400) // matches the qxp-fade-out animation duration in widget.css
}

// Splits a message into alternating text/emote parts for rendering. Twitch's
// own emotes arrive pre-located in twitchEmotes (along with FFZ/BTTV, which
// StreamElements folds into the same array), but 7TV never does, so it's
// matched here by scanning the raw text for whole-word occurrences of any
// known 7TV emote name before everything gets combined and split.
function parseMessage(text, twitchEmotes) {
  const combined = [...twitchEmotes]

  for (const name of Object.keys(QXP.sevenTV)) {
    let index = text.indexOf(name)
    while (index !== -1) {
      const before = text[index - 1]
      const after = text[index + name.length]
      if ((!before || /\s/.test(before)) && (!after || /\s/.test(after))) {
        combined.push({ provider: 'sevenTV', name, start: index, end: index + name.length - 1 })
      }
      index = text.indexOf(name, index + 1)
    }
  }

  const active = combined.filter(e =>
    e.provider === 'sevenTV' || ['twitch', 'ffz', 'bttv', 'sticker'].includes(e.type)
  )

  if (active.length === 0) return [{ type: 'text', data: text }]

  const escapedNames = active.map(e => e.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
  const regex = new RegExp(`(?<=\\s|^)(?:${escapedNames.sort((a, b) => b.length - a.length).join('|')})(?=\\s|$|[.,!])`, 'g')

  const textChunks = text.split(regex)
  const last = textChunks.pop()
  const parts = []
  textChunks.forEach((chunk, i) => {
    parts.push({ type: 'text', data: chunk })
    parts.push({ type: 'emote', data: active[i] })
  })
  parts.push({ type: 'text', data: last })
  return parts
}

// Resolves the actual image URL for one parsed emote part - 7TV uses its own
// map (built by loadSevenTVEmotes), native Twitch emotes are built from the
// emote ID, and everything else (FFZ/BTTV) already carries a urls object.
function emoteUrl(emote) {
  if (emote.provider === 'sevenTV') return QXP.sevenTV[emote.name].urls[4]
  if (emote.type === 'twitch') {
    return `https://static-cdn.jtvnw.net/emoticons/v2/${emote.id}/default/light/3.0`
  }
  return emote.urls?.[4] || emote.urls?.[2] || emote.urls?.[1]
}

// Determines the emote size class for a message: real text present = normal
// inline size, a single emote with no text = biggest, multiple emotes with
// no text = medium. Only applies when Larger Emotes for Emote-Only Messages
// is on - see buildWindowHtml above.
function sizeForContent(parts) {
  let emoteCount = 0
  for (const part of parts) {
    if (part.type === 'emote') emoteCount++
    else if (part.data.trim() !== '') return 1
  }
  return emoteCount > 1 ? 2 : 4
}

function hasBadge(badges, ...types) {
  return badges.some(b => types.includes(b.type))
}

// Shared pool of placeholder names/messages for both Preview Mode and Send
// Test Message - deliberately includes a long message (wrapping test), a
// short one, and a name with a space in it.
const PREVIEW_NAMES = [
  'Quantumtherobot', 'mocchipinku', 'coolviewer123', 'notAbot', 'gamer', 'wintonOverwatch',
]

const PREVIEW_TEXTS = [
  'HYPE',
  'this is a very long message specifically designed to test if the chat doesnt break when someone sends a long message, if it doesnt this should look fine',
  'gg well played',
  'Hello chat',
  'are we live?',
  'Jarvis, clip that',
  'this is chat is very cool whoever designed must be cool and handsome',
]

// Preview Mode's continuous loop - only ever started from onWidgetLoad when
// both the field is on and we're in the StreamElements editor (never live).
// Keeps rescheduling itself via setTimeout rather than setInterval so it can
// check QXP.fields.previewMode fresh each tick and stop cleanly if turned off.
function sendPreviewMessages(gap) {
  const tick = () => {
    if (!QXP.fields.previewMode) return
    const name = PREVIEW_NAMES[randomInt(0, PREVIEW_NAMES.length - 1)]
    const text = PREVIEW_TEXTS[randomInt(0, PREVIEW_TEXTS.length - 1)]
    handleMessage({
      data: {
        userId: name, nick: name.toLowerCase(), displayName: name,
        text, emotes: [], badges: [], tags: {},
        msgId: `${name}_${Date.now()}`,
      },
    }, true)
    setTimeout(tick, gap)
  }
  tick()
}

async function fetchJson(url) {
  try {
    const res = await fetch(url)
    return res.ok ? await res.json() : null
  } catch {
    return null
  }
}

function toList(str = '') {
  return str.split(',').map(s => s.trim()).filter(Boolean)
}

function matchesUserList(list, ...names) {
  const lower = names.map(n => (n || '').toLowerCase())
  return list.some(u => lower.includes(u.toLowerCase()))
}

function startsWithIgnoredPrefix(text) {
  return QXP.fields.ignorePrefixes.some(p => text.startsWith(p))
}

// Everyone passes if Show Messages From Everyone is on. Otherwise the
// chatter needs a matching badge - broadcaster always passes regardless of
// the other toggles.
function isPermittedUserLevel(badges) {
  if (QXP.fields.includeEveryone) return true
  if (!badges.length) return false
  const allowed = ['broadcaster']
  if (QXP.fields.includeSubs) allowed.push('subscriber', 'founder')
  if (QXP.fields.includeVIPs) allowed.push('vip')
  if (QXP.fields.includeMods) allowed.push('moderator')
  return hasBadge(badges, ...allowed)
}

// Deterministic fallback color for chatters whose message didn't carry a
// Twitch display color - same name always maps to the same color.
function colorFromName(name) {
  const palette = ['#FF4A80', '#FF7070', '#FA8E4B', '#FEE440', '#5FFF77', '#00F5D4', '#00BBF9', '#4371FB', '#9B5DE5', '#F670DD']
  const sum = [...(name || '')].reduce((acc, ch) => acc + ch.charCodeAt(0), 0)
  return palette[sum % palette.length]
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min
}

function toggleClass(name, condition) {
  document.querySelector('main').classList.toggle(name, !!condition)
}

// Escapes viewer-supplied text before it's inserted as HTML, so a chatter
// can't break the layout (or inject markup) with their username or message.
function htmlEscape(text) {
  return text.replace(/[<>"'^=]/g, ch => `&#${ch.charCodeAt(0)};`)
}

function escapeHtml(text) {
  return htmlEscape(text)
}

</script>

  },

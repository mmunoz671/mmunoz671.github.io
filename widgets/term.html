/* Fill the entire widget iframe - without this, the widget's visible
   content can end up smaller than (and not tracking) the box size SE
   gives it when the streamer resizes it. */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ---------------------------------------------------------------------
   Monitor bezel frame (optional, off by default)
   --------------------------------------------------------------------- */

#crt-monitor {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  position: relative;
}

/* Bezel thickness uses min(vw, vh) rather than a plain percentage.
   CSS padding percentages always resolve against the container's
   WIDTH, even for top/bottom padding - on a very wide, short widget
   that made the bezel balloon out of proportion. min(vw, vh) scales
   with whichever dimension is actually smaller instead, so the frame
   stays proportional at any aspect ratio. */
#crt-monitor.framed {
  padding-top: min(4.5vw, 4.5vh);
  padding-left: min(4.5vw, 4.5vh);
  padding-right: min(4.5vw, 4.5vh);
  padding-bottom: min(7vw, 7vh);
  background: linear-gradient(160deg,
    color-mix(in srgb, var(--frame-color, #ddd0b0) 85%, white 15%),
    color-mix(in srgb, var(--frame-color, #ddd0b0) 55%, black 45%));
  border-radius: 10px;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 3px rgba(0, 0, 0, 0.5);
}

/* Small power LED, bottom-right of the bezel. Always matches the text
   color (phosphor preset or custom), not the frame color. */
#crt-monitor.framed::after {
  content: '';
  position: absolute;
  bottom: 2.4%;
  right: 5%;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--term-color, #3dff6e);
  box-shadow: 0 0 6px var(--term-color, #3dff6e);
}

#screen-bezel {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}

/* The dark recessed lip between the plastic frame and the actual
   screen. Its color is derived from --frame-color (not a fixed dark
   gray) so it visibly relates to whatever frame color is chosen,
   instead of looking the same regardless of the frame. */
#crt-monitor.framed #screen-bezel {
  padding: 14px;
  border-radius: 6px;
  background: radial-gradient(circle at 50% 25%,
    color-mix(in srgb, var(--frame-color, #ddd0b0) 40%, black 60%),
    color-mix(in srgb, var(--frame-color, #ddd0b0) 18%, black 82%) 85%);
  box-shadow:
    inset 0 0 0 3px color-mix(in srgb, var(--frame-color, #ddd0b0) 45%, black 55%),
    inset 0 0 16px 5px rgba(0, 0, 0, 0.55),
    inset 0 2px 3px rgba(255, 255, 255, 0.08);
}

/* ---------------------------------------------------------------------
   Screen / CRT frame
   ---------------------------------------------------------------------
   #crt-frame is a column flexbox so the pinned alert strip (if active)
   stacks above the scrolling chat log. It's also the element that gets
   --term-color, font-family, and font-size set on it from JS - see the
   note in applyEffectClasses() in the JS file for why that matters. */

#crt-frame {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a0a;
  border-radius: 6px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  font-family: 'ModernDOS9x16', 'Courier New', monospace;
  font-size: var(--font-size, 22px);
}

#crt-frame.no-bg {
  background: transparent;
}

#crt-frame.curvature {
  border-radius: 18px;
  box-shadow: inset 0 0 70px 14px rgba(0, 0, 0, 0.85);
}

#crt-frame.curvature.no-bg {
  box-shadow: none;
}

/* ---------------------------------------------------------------------
   Chat log
   --------------------------------------------------------------------- */

#chat-container {
  position: relative;
  z-index: 1;
  width: 100%;
  flex: 1;          /* fills whatever space isn't taken by the pinned alert strip */
  min-height: 0;
  overflow: hidden;  /* clips old messages at this box's own edge as soon as it shrinks, rather than letting them visually spill upward */
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 3%;
  box-sizing: border-box;
  font-family: inherit; /* inherits from #crt-frame, which JS sets dynamically */
  font-size: var(--font-size, 22px);
  letter-spacing: 0.5px;
  line-height: 1.5;
  gap: 0.2em;
}

#crt-frame.flicker #chat-container {
  animation: term-flicker 4s infinite;
}

/* ---------------------------------------------------------------------
   Alerts: pinned strip
   --------------------------------------------------------------------- */

#alert-pinned {
  position: relative;
  z-index: 2;
  width: 100%;
  box-sizing: border-box;
  font-family: inherit;
  font-size: var(--font-size, 22px);
  letter-spacing: 0.5px;
  line-height: 1.4;
  padding: 0 3%;
  color: var(--term-color, #3dff6e);
  max-height: 0;      /* collapsed by default; JS toggles .active to expand it */
  overflow: hidden;
  transition: max-height 0.2s ease;
}

#alert-pinned:empty {
  padding: 0 3%;
}

#alert-pinned.active {
  max-height: 40%;
  padding: 2% 3%;
  background: #0a0a0a; /* opaque, so nothing from the chat log underneath can show through while this is expanded */
  border-bottom: 1px dashed color-mix(in srgb, var(--term-color, #3dff6e) 40%, transparent);
}

/* ---------------------------------------------------------------------
   Alerts: full-screen takeover
   --------------------------------------------------------------------- */

#alert-takeover {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: none;       /* JS toggles .active to show it */
  flex-direction: column; /* without this, each alert line would lay out side by side instead of stacking as separate lines */
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  font-family: inherit;
  font-size: var(--font-size, 22px);
  letter-spacing: 0.5px;
  line-height: 1.4;
  color: var(--term-color, #3dff6e);

  box-sizing: border-box;
  text-align: center;
}

#alert-takeover.active {

}

/* Shared styling for every alert line, regardless of which display
   mode (pinned / takeover / inline-in-chat) is currently rendering it. */
.alert-line {
  color: var(--term-color, #3dff6e);
  white-space: pre-wrap;

}

@keyframes term-flicker {
  0%   { opacity: 1; }
  42%  { opacity: 1; }
  43%  { opacity: 0.86; }
  44%  { opacity: 1; }
  70%  { opacity: 1; }
  71%  { opacity: 0.9; }
  72%  { opacity: 1; }
  100% { opacity: 1; }
}

/* ---------------------------------------------------------------------
   Chat message line styling
   --------------------------------------------------------------------- */

.term-line {
  color: var(--term-color, #3dff6e);
  white-space: pre-wrap;
  word-break: break-word;
}

#chat-container.roomy {
  gap: 0.9em;
}

#chat-container.max-width .term-line {
  max-width: var(--line-width, 70ch);
}

.term-timestamp {
  opacity: 0.55;
}

/* Divider lines between messages - a literal row of dash characters
   (see insertDivider() in the JS), not a CSS border, so it reads as
   real typed ASCII in the same font as everything else. */
.term-divider {
  color: var(--term-color, #3dff6e);
  opacity: 0.5;
  overflow: hidden;
  white-space: nowrap;
  line-height: 1;
}

#crt-frame.glow .term-line, #crt-frame.glow .term-divider, #crt-frame.glow .alert-line {
  text-shadow: 0 0 0.2em var(--term-color, #3dff6e), 0 0 0.5em var(--term-color, #3dff6e);
}

/* The username gets its own glow rule using currentColor rather than
   inheriting the line's glow. text-shadow is inherited as an already-
   resolved value, so without this, a username colored to match a
   viewer's own Twitch color would still glow in the phosphor color
   instead of its own - currentColor here makes it follow whatever
   color that specific span is actually rendering in. */
#crt-frame.glow .term-username {
  text-shadow: 0 0 0.2em currentColor, 0 0 0.5em currentColor;
}

.term-prompt {
  opacity: 0.85;
  margin-right: 0.4em; /* guarantees a gap before the message text, independent of whether promptFormat's own trailing space survives being saved */
}

.term-cursor {

  width: 0.5em;

  background: var(--term-color, #3dff6e);
  vertical-align: text-bottom;

@keyframes cursor-blink {

  50%, 100% { opacity: 0; }
}

.term-badges img {

  margin-right: 0.35em;
  border: 1px solid var(--term-color, #3dff6e);
  border-radius: 3px;
  font-size: 0.7em;
  vertical-align: middle;

.term-emote {

/* ---------------------------------------------------------------------

#scanline-overlay {

<script>
// original widget by Quantumtherobot
//
// This file is commented throughout so you can safely read and modify it.
// It's organized top to bottom as: config/state, small helpers, pronoun
// lookups, effect/theme application, chat message rendering + typewriter,
// user/bot filtering, alert content builders, the alert display engine,
// the test-mode sample loop, and finally the StreamElements event wiring
// at the bottom (onWidgetLoad / onEventReceived) that ties it all together.

(function () {
// Guards against the SE editor re-injecting this script (e.g. on save/
// preview) without a full page reload, which would otherwise attach a
// second copy of every event listener below and cause things like alerts
// firing twice.
if (window.__qntmosTerminalChatLoaded) return;
window.__qntmosTerminalChatLoaded = true;

// ---------------------------------------------------------------------
// Config & constants
// ---------------------------------------------------------------------

// Hex values for each phosphor color preset. Used unless the user turns
// on "Use custom text color" in the Colors - Custom field group.
const PHOSPHOR = {
  green: '#3dff6e',
  amber: '#ffb000',
  white: '#f2ecc4',
  blue: '#4fc3ff',
  red: '#ff4d4d',
  cyan: '#4dfff2'
};

// Sample names/messages cycled through by the test-mode preview loop.
const TEST_NAMES = ['Quantumtherobot', 'mocchipinku', 'coolviewer123', 'notAbot', 'gamer', 'wintonOverwatch'];
const TEST_MESSAGES = [
  'HYPE',
  'this is a very long message specifically designed to test if the chat doesnt break when someone sends a long message, if it doesnt this should look fine',
  'gg well played',
  'Hello chat',
  'are we live?',
  'Jarvis, clip that',
  'this is chat is very cool whoever designed must be cool and handsome'
];

// Default values for every field in fields.json. These get overwritten
// with the streamer's actual saved settings once 'onWidgetLoad' fires
// (see the very bottom of this file) - until then, this is what renders.
let fields = {
  promptFormat: '{user}@chat:~$ ',
  fontSource: 'builtin',
  localFontName: '',
  customFont: '',
  phosphor: 'green',
  useCustomTextColor: false,
  customTextColor: '#3dff6e',
  useTwitchColor: false,
  useCustomFrameColor: false,
  customFrameColor: '#ddd0b0',
  scanlines: true,
  flicker: true,
  glow: true,
  curvature: true,
  showBackground: true,
  showMonitorFrame: false,
  showBadges: true,
  showDividers: false,
  roomySpacing: false,
  maxLineWidth: false,
  lineWidthChars: 70,
  showTimestamps: false,
  messageDuration: 8000,
  typeSpeed: 28,
  fontSize: 22,
  testMode: true,
  alertDisplayMode: 'pinned',
  alertInterruptMode: 'pause',
  enableFollowAlert: true,
  followAlertDuration: 4000,
  enableSubAlert: true,
  subAlertDuration: 6000,
  enableBitsAlert: true,
  bitsAlertDuration: 6000,
  enableDonoAlert: true,
  donoAlertDuration: 8000,
  enableRaidAlert: true,
  raidAlertDuration: 6000,
  followFormat: '[+] new_follower: {user}',
  subFormatLine1: '$ sudo subscribe --user={user} --tier={tier}',
  subFormatLine2: '[OK] subscription confirmed',
  bitsFormat: '$ ./transfer.sh --bits={amount} --from={user}',
  bitsCompleteText: 'TRANSFER COMPLETE',
  donoFormatLine1: 'DONATION RECEIVED: {amount}',
  donoFormatLine2: 'from: {user}',
  raidBannerText: '*** INCOMING RAID ***',
  raidFormat: '$ ./raid_handler.sh --from={user} --viewers={amount}',
  raidCompleteText: '[OK] raid squad welcomed',
  includeEveryone: true,
  includeSubs: true,
  includeVIPs: true,
  includeMods: true,
  allowUsers: '',
  ignoreUsers: 'StreamElements, Streamlabs, Nightbot',
  ignorePrefixes: '!',
  pronounsMode: 'off',
  pronounsLowercase: false,
  customPronounColors: false,
  pronounBackgroundColor: '#0a0a0a',
  pronounBorderColor: '#3dff6e',
  pronounTextColor: '#3dff6e'
};

// ---------------------------------------------------------------------
// Shared state & DOM references
// ---------------------------------------------------------------------

let isLive = false;       // true once any real chat message or alert has arrived - permanently disables test mode for this session
let testTimer = null;     // interval handle for the test-mode chat sample loop

const monitor = document.getElementById('crt-monitor');
const frame = document.getElementById('crt-frame');
const container = document.getElementById('chat-container');
const alertPinned = document.getElementById('alert-pinned');
const alertTakeover = document.getElementById('alert-takeover');

const queue = [];             // pending chat messages waiting to be typed out
let typing = false;           // true while a message is currently being typed
let chatPaused = false;       // true while an "Interrupt: Pause" alert is playing
let activeCursor = null;      // the blinking cursor element on the most recent line
let fontLinkTag = null;       // <link> element used for Google Font loading
const alertQueue = [];        // pending alerts waiting to be shown
let alertPlaying = false;     // true while an alert is currently being displayed
let currencySymbol = '$';     // set once from onWidgetLoad's channel currency info
let pronounList = [];         // full list of pronouns from pronouns.alejo.io, once loaded
const pronounCache = {};      // per-username pronoun lookups, cached for the session

// ---------------------------------------------------------------------
// Small generic helpers
// ---------------------------------------------------------------------

// Loads (or swaps) the Google Font stylesheet. Passing an empty string
// clears it, which is what happens whenever Font source isn't set to
// Google Font, since the <link> would otherwise keep an old font loaded.
function applyGoogleFont(fontName) {
  if (!fontLinkTag) {
    fontLinkTag = document.createElement('link');
    fontLinkTag.rel = 'stylesheet';
    document.head.appendChild(fontLinkTag);
  }
  fontLinkTag.href = fontName
    ? 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fontName).replace(/%20/g, '+') + '&display=swap'
    : '';
}

// Escapes arbitrary text before it gets inserted via innerHTML, so a
// username or message containing HTML-special characters can't break
// out of the markup we're building.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Only accepts real hex colors (#abc or #aabbcc) before letting a value
// (e.g. a viewer's Twitch color) get inserted into an inline style.
function isValidColor(color) {
  return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color || '');
}

// ---------------------------------------------------------------------
// Pronouns (pronouns.alejo.io)
// ---------------------------------------------------------------------
// There's no official documentation for this API, so this section leans
// on a confirmed-working reference implementation rather than guesswork:
// GET /api/pronouns returns a list of { name, display, ... } where
// "name" is a compact id (e.g. "hehim") and "display" is the actual
// human-readable slash-formatted string (e.g. "he/him"). GET
// /api/users/{login} returns that same compact "name" value as
// "pronoun_id" for a specific user - it has to be cross-referenced
// against the full list above to get something displayable.

let pronounListPromise = null;

// Fetches the full pronoun list once and caches the in-flight promise,
// so multiple simultaneous callers don't trigger duplicate requests.
function ensurePronounList() {
  if (!pronounListPromise) {
    pronounListPromise = fetch('https://pronouns.alejo.io/api/pronouns')
      .then(r => r.ok ? r.json() : [])
      .then(list => { pronounList = list || []; return pronounList; })
      .catch(() => { pronounList = []; return pronounList; });
  }
  return pronounListPromise;
}

function formatPronounEntry(entry) {
  if (!entry) return '';
  return entry.display || entry.name || '';
}

// Used for test/preview messages - picks a random entry rather than
// doing a real per-user lookup, since preview usernames aren't real.
function getRandomPronoun() {
  if (!pronounList.length) return '';
  return formatPronounEntry(pronounList[Math.floor(Math.random() * pronounList.length)]);
}

// Turns a compact id (from the per-user endpoint) into a display string
// by finding its matching entry in the full pronoun list.
function displayForPronounId(id) {
  if (!id) return '';
  const match = pronounList.find(p => p.name === id);
  if (match) return formatPronounEntry(match);
  return id;
}

// Resolves the pronoun to show for a message. Real messages look up the
// actual viewer (cached after the first lookup); preview/test messages
// get a random one instead. Returns '' immediately if pronouns are off.
function resolvePronoun(login, isPreview) {
  if (fields.pronounsMode === 'off') return Promise.resolve('');
  if (isPreview) return ensurePronounList().then(() => getRandomPronoun());
  if (!login) return Promise.resolve('');
  if (pronounCache[login] !== undefined) return Promise.resolve(pronounCache[login]);
  return ensurePronounList().then(() =>
    fetch('https://pronouns.alejo.io/api/users/' + login)
      .then(r => r.ok ? r.json() : [])
      .then(data => {
        const id = (data && data[0] && data[0].pronoun_id) ? data[0].pronoun_id : '';
        const value = id ? displayForPronounId(id) : '';
        pronounCache[login] = value;
        return value;
      })
      .catch(() => '')
  );
}

// Builds the HTML snippet for a resolved pronoun, in either suffix
// style "(they/them)" or a small bordered badge. Returns '' if there's
// nothing to show, so it's safe to always call this.
function buildPronoun(pronoun) {
  if (!pronoun || fields.pronounsMode === 'off') return '';
  const text = fields.pronounsLowercase ? pronoun.toLowerCase() : pronoun;
  if (fields.pronounsMode === 'suffix') {
    return ' <span class="term-pronoun-suffix">(' + escapeHtml(text) + ')</span>';
  }
  const style = fields.customPronounColors
    ? ' style="background:' + fields.pronounBackgroundColor + ';border-color:' + fields.pronounBorderColor + ';color:' + fields.pronounTextColor + '"'
    : '';
  return ' <span class="term-pronoun-badge"' + style + '>' + escapeHtml(text) + '</span>';
}

// ---------------------------------------------------------------------
// Theme / effect application
// ---------------------------------------------------------------------

// Applies every visual setting (CRT effect toggles, color, font, frame
// color, readability options) to the DOM. Called once at load and again
// any time the streamer changes a field in the editor.
//
// Important: --term-color is set on `monitor` (#crt-monitor), the
// outermost container, not on `frame` (#crt-frame) or `container`
// (#chat-container). CSS custom properties only inherit downward to
// descendants, never upward - #crt-monitor's own power-LED indicator
// (drawn via ::after directly on that element) needs to read this same
// color, so it has to be set on #crt-monitor itself or above; setting it
// on a descendant like #crt-frame left the LED unable to see it at all,
// silently falling back to a hardcoded default color regardless of the
// chosen phosphor/custom color. Font-family and --font-size stay on
// `frame`, since #alert-pinned and #alert-takeover are siblings of
// #chat-container (not descendants of it) and need those specifically -
// #crt-frame is their shared parent.
function applyEffectClasses() {
  frame.classList.toggle('scanlines', !!fields.scanlines);
  frame.classList.toggle('flicker', !!fields.flicker);
  frame.classList.toggle('glow', !!fields.glow);
  frame.classList.toggle('curvature', !!fields.curvature);
  frame.classList.toggle('no-bg', !fields.showBackground);
  monitor.classList.toggle('framed', !!fields.showMonitorFrame);

  const textColor = fields.useCustomTextColor ? fields.customTextColor : (PHOSPHOR[fields.phosphor] || PHOSPHOR.green);
  monitor.style.setProperty('--term-color', textColor);

  // Font source: built-in (embedded in the CSS, always available) takes
  // a back seat to Local or Google Font if the streamer picked one.
  let primaryFont = "'ModernDOS9x16'";
  let googleFontToLoad = '';
  if (fields.fontSource === 'local' && fields.localFontName) {
    primaryFont = "'" + fields.localFontName + "'";
  } else if (fields.fontSource === 'google' && fields.customFont) {
    primaryFont = "'" + fields.customFont + "'";
    googleFontToLoad = fields.customFont;
  }
  frame.style.fontFamily = primaryFont + ", 'ModernDOS9x16', 'Courier New', monospace";
  applyGoogleFont(googleFontToLoad);

  frame.style.setProperty('--font-size', (fields.fontSize || 22) + 'px');
  container.style.setProperty('--line-width', (fields.lineWidthChars || 70) + 'ch');
  monitor.style.setProperty('--frame-color', fields.useCustomFrameColor ? fields.customFrameColor : '#ddd0b0');
  container.classList.toggle('roomy', !!fields.roomySpacing);
  container.classList.toggle('max-width', !!fields.maxLineWidth);
}

// ---------------------------------------------------------------------
// Chat message rendering
// ---------------------------------------------------------------------

function buildBadges(badgeList) {
  if (!fields.showBadges || !badgeList || !badgeList.length) return '';
  return '<span class="term-badges">' + badgeList.map(b =>
    '<img src="' + b.url + '" alt="" />'
  ).join('') + '</span>';
}

function buildTimestamp() {
  if (!fields.showTimestamps) return '';
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  return '<span class="term-timestamp">[' + hh + ':' + mm + '] </span>';
}

// Builds the full prompt line (e.g. "quantumtherobot@chat:~$ ") from the
// editable promptFormat template, substituting {user} with the username
// (optionally colored to match the viewer's own Twitch chat color) plus
// their pronoun display right after it.
function renderPrompt(displayName, color, pronoun) {
  const parts = fields.promptFormat.split('{user}');
  const safeName = escapeHtml(displayName);
  const nameHtml = (fields.useTwitchColor && isValidColor(color))
    ? '<span class="term-username" style="color:' + color + '">' + safeName + '</span>'
    : '<span class="term-username">' + safeName + '</span>';
  return parts.map(escapeHtml).join(nameHtml + buildPronoun(pronoun));
}

// Messages are queued and typed out one at a time (see processQueue),
// rather than all appearing instantly, so the typewriter effect from
// one message never overlaps with the next.
function queueMessage(msg) {
  queue.push(msg);
  processQueue();
}

function processQueue() {
  if (typing || chatPaused || !queue.length) return;
  typing = true;
  const msg = queue.shift();
  typeMessage(msg, () => {
    typing = false;
    processQueue();
  });
}

// Removes the oldest message(s) only until everything actually fits
// within the chat box's current height. This adapts automatically to
// whatever size the widget is resized to, rather than always keeping a
// fixed number of messages on screen regardless of available space.
function trimToFit() {
  while (container.children.length > 1 && container.scrollHeight > container.clientHeight) {
    container.removeChild(container.firstChild);
  }
}

// Builds a lookup of { emoteCode: imageUrl } from whatever emote data
// StreamElements attaches to the chat message event.
function buildEmoteMap(emotes) {
  const map = {};
  (emotes || []).forEach(e => {
    if (!e || !e.name) return;
    const url = e.url || (e.urls && (e.urls['2'] || e.urls['1'] || Object.values(e.urls)[0]));
    if (url) map[e.name] = url;
  });
  return map;
}

// Splits a message into typing "chunks": most content is broken into
// individual characters (for the letter-by-letter typewriter effect),
// but a recognized emote code becomes a single chunk that pops in as a
// whole image at once, rather than typing out its literal text first.
function buildTypingChunks(text, emotes) {
  const emoteMap = buildEmoteMap(emotes);
  const words = text.split(/(\s+)/);
  const chunks = [];
  words.forEach((word) => {
    if (emoteMap[word]) {
      chunks.push({
        type: 'emote',
        html: '<img class="term-emote" src="' + emoteMap[word] + '" alt="' + escapeHtml(word) + '" />'
      });
    } else {
      for (const ch of word) {
        chunks.push({ type: 'char', char: ch });
      }
    }
  });
  return chunks;
}

// Adds a row of literal dash characters between messages, in the same
// font as everything else (not a CSS border), when dividers are on.
function insertDivider() {
  if (!fields.showDividers) return;
  if (!container.querySelector('.term-line')) return;
  const divider = document.createElement('div');
  divider.className = 'term-divider';
  divider.textContent = '-'.repeat(200);
  container.appendChild(divider);
}

// Types out a single chat message character-by-character (with emotes
// popping in whole), then hands off to onDone once fully typed so the
// next queued message can start. The blinking cursor always stays on
// whichever message was typed most recently, moving off the previous
// one rather than disappearing entirely once typing finishes.
function typeMessage(msg, onDone) {
  if (activeCursor && activeCursor.parentNode) {
    activeCursor.remove();
  }
  insertDivider();

  const line = document.createElement('div');
  line.className = 'term-line';
  line.innerHTML = buildTimestamp() + buildBadges(msg.badges) +
    '<span class="term-prompt">' + renderPrompt(msg.displayName, msg.color, msg.pronoun) + '</span>';

  const textSpan = document.createElement('span');
  textSpan.className = 'term-text';
  const cursor = document.createElement('span');
  cursor.className = 'term-cursor';
  activeCursor = cursor;
  line.appendChild(textSpan);
  line.appendChild(cursor);
  container.appendChild(line);

  trimToFit();

  const chunks = buildTypingChunks(msg.text, msg.emotes);
  let i = 0;
  const step = () => {
    if (i < chunks.length) {
      const chunk = chunks[i];
      if (chunk.type === 'emote') {
        textSpan.insertAdjacentHTML('beforeend', chunk.html);
      } else {
        textSpan.appendChild(document.createTextNode(chunk.char));
      }
      i++;
      trimToFit(); // re-check as the message grows, in case a long one needs more room
      setTimeout(step, fields.typeSpeed);
    } else {
      // duration === 0 means "infinite" - never schedule a removal at all
      if (fields.messageDuration > 0) {
        setTimeout(() => { if (line.parentNode) line.parentNode.removeChild(line); }, fields.messageDuration);
      }
      onDone();
    }
  };
  step();
}

// ---------------------------------------------------------------------
// User Filters / Bot Filters
// ---------------------------------------------------------------------
// Everything here only applies to real chat messages (see
// handleChatEvent below) - it never touches alerts or test/preview
// messages.

function parseList(str) {
  return (str || '').split(',').map(s => s.trim()).filter(Boolean);
}

function matchesUserList(list, name) {
  const lower = (name || '').toLowerCase();
  return list.some(u => u.toLowerCase() === lower);
}

function startsWithIgnoredPrefix(text, prefixes) {
  return prefixes.some(p => (text || '').startsWith(p));
}

function hasBadgeType(badges, types) {
  return (badges || []).some(b => types.includes(b.type || b.name));
}

// "Show messages from everyone" short-circuits everything else. If it's
// off, only the broadcaster plus whichever of subs/VIPs/mods are also
// individually enabled get through.
function isPermittedUserLevel(badges) {
  if (fields.includeEveryone) return true;
  const allowed = ['broadcaster'];
  if (fields.includeSubs) allowed.push('subscriber', 'founder');
  if (fields.includeVIPs) allowed.push('vip');
  if (fields.includeMods) allowed.push('moderator');
  return hasBadgeType(badges, allowed);
}

// The allow-list ("Only show these users"), if filled in, overrides
// every other filter - it's an exclusive list, not an addition to them.
function shouldShowMessage(name, text, badges) {
  const allowList = parseList(fields.allowUsers);
  if (allowList.length) return matchesUserList(allowList, name);
  if (matchesUserList(parseList(fields.ignoreUsers), name)) return false;
  if (startsWithIgnoredPrefix(text, parseList(fields.ignorePrefixes))) return false;
  return isPermittedUserLevel(badges);
}

// Entry point for real chat messages coming from StreamElements. A
// message still counts as "we're live now" (stopping test mode) even if
// it ends up filtered out, since real chat activity happening at all is
// what matters for that decision.
function handleChatEvent(data) {
  isLive = true;
  stopTestLoop();
  const name = data.displayName || data.nick;
  if (!shouldShowMessage(name, data.text, data.badges)) return;
  resolvePronoun(data.nick, false).then(pronoun => {
    queueMessage({
      displayName: name,
      text: data.text,
      badges: data.badges,
      color: data.displayColor || (data.tags && data.tags.color),
      emotes: data.emotes,
      pronoun: pronoun
    });
  });
}

// ---------------------------------------------------------------------
// Alert content builders
// ---------------------------------------------------------------------
// Each of these turns a real (or emulated) event into a list of "steps"
// for the alert display engine below to play out. A step is either
// { type: 'line', text } (a full line of text, revealed at once) or
// { type: 'bar', completeText } (the bits alert's animated fill bar).

// Centers text inside a fixed-width field, used for the donation box's
// interior lines. Adds one extra space of padding on each side.
function centerPad(text, width) {
  const pad = Math.max(0, width - text.length);
  const left = Math.floor(pad / 2);
  const right = pad - left;
  return ' '.repeat(left + 1) + text + ' '.repeat(right + 1);
}

// Normalizes whatever tier value StreamElements sends (which might be a
// raw number like 1000/2000/3000, a string, or "prime") into something
// short and readable for the {tier} placeholder.
function formatSubTier(tier) {
  if (tier === 'prime' || tier === 'Prime') return 'Prime';
  const n = parseInt(tier, 10);
  if (n >= 1000) return String(Math.round(n / 1000));
  return String(tier || '1');
}

// Substitutes {user}/{amount}/{tier}-style placeholders in a streamer-
// editable template string. Leaves unknown placeholders untouched
// rather than blanking them out, in case of a typo.
function fillTemplate(template, vars) {
  return template.replace(/\{(\w+)\}/g, (match, key) => (vars[key] !== undefined ? vars[key] : match));
}

function buildFollowSteps(name) {
  return [{ type: 'line', text: fillTemplate(fields.followFormat, { user: name }) }];
}

function buildSubSteps(name, tier) {
  const vars = { user: name, tier: formatSubTier(tier) };
  return [
    { type: 'line', text: fillTemplate(fields.subFormatLine1, vars) },
    { type: 'line', text: fillTemplate(fields.subFormatLine2, vars) }
  ];
}

function buildBitsSteps(name, amount) {
  const vars = { user: name, amount: amount };
  return [
    { type: 'line', text: fillTemplate(fields.bitsFormat, vars) },
    { type: 'bar', completeText: fields.bitsCompleteText }
  ];
}

// The donation box is drawn with plain ASCII characters (+, -, |)
// rather than Unicode box-drawing glyphs (┌─┐│└┘) - the bundled pixel
// font doesn't include those, and the browser would silently substitute
// a different fallback font just for those characters, making the box
// look visibly inconsistent with the rest of the text.
function buildDonoSteps(name, amount, currency) {
  const amountText = (currency || '$') + Number(amount).toFixed(2);
  const vars = { user: name, amount: amountText };
  const line1Text = fillTemplate(fields.donoFormatLine1, vars);
  const line2Text = fillTemplate(fields.donoFormatLine2, vars);
  const width = Math.max(line1Text.length, line2Text.length) + 2;
  return [
    { type: 'line', text: '+' + '-'.repeat(width) + '+' },
    { type: 'line', text: '|' + centerPad(line1Text, width) + '|' },
    { type: 'line', text: '|' + centerPad(line2Text, width) + '|' },
    { type: 'line', text: '+' + '-'.repeat(width) + '+' }
  ];
}

function buildRaidSteps(name, amount) {
  const vars = { user: name, amount: amount };
  return [
    { type: 'line', text: fields.raidBannerText },
    { type: 'line', text: fillTemplate(fields.raidFormat, vars) },
    { type: 'line', text: fillTemplate(fields.raidCompleteText, vars) }
  ];
}

// ---------------------------------------------------------------------
// Alert display engine
// ---------------------------------------------------------------------

// Plays a list of steps into `target` one at a time, calling onDone once
// every step has finished. `chatIntegrated` should be true only when
// `target` is (a wrapper around) the real chat log, so trimToFit() runs
// as content is added - pinned/takeover alerts have their own separate
// display area and don't need that check.
function runAlertSteps(target, steps, onDone, chatIntegrated) {
  let i = 0;
  const next = () => {
    if (i >= steps.length) {
      onDone();
      return;
    }
    const step = steps[i];
    i++;
    if (step.type === 'bar') {
      const line = document.createElement('div');
      line.className = 'alert-line';
      target.appendChild(line);
      if (chatIntegrated) trimToFit();
      let filled = 0;
      const totalSegments = 10;
      const fillStep = () => {
        filled++;
        const bar = '[' + '\u2588'.repeat(filled) + ' '.repeat(totalSegments - filled) + ']';
        line.textContent = bar + (filled >= totalSegments ? ' ' + (step.completeText || 'TRANSFER COMPLETE') : '');
        if (filled < totalSegments) {
          setTimeout(fillStep, 90);
        } else {
          setTimeout(next, 400);
        }
      };
      fillStep();
    } else {
      const line = document.createElement('div');
      line.className = 'alert-line';
      line.textContent = step.text;
      target.appendChild(line);
      if (chatIntegrated) trimToFit();
      setTimeout(next, 450);
    }
  };
  next();
}

function queueAlert(job) {
  alertQueue.push(job);
  processAlertQueue();
}

function processAlertQueue() {
  if (alertPlaying || !alertQueue.length) return;
  alertPlaying = true;
  const job = alertQueue.shift();
  showAlert(job, () => {
    alertPlaying = false;
    processAlertQueue();
  });
}

// Incrementing tokens for the pinned/takeover single-slot displays. Each
// time a new alert starts playing in that slot, it gets its own token.
// When that alert's duration timer later fires to clear the slot, it
// only actually clears it if its token still matches the current one -
// otherwise a newer alert has already taken over that same slot, and
// the old timer should do nothing rather than wipe out the new content.
let pinnedToken = 0;
let takeoverToken = 0;

// Plays one alert according to the streamer's chosen display settings.
// onDone() always fires promptly once the alert's steps finish typing -
// it does NOT wait for the alert's visual duration to elapse first, so
// one long/infinite-duration alert can never permanently block the next
// one in the queue from at least starting. Duration only controls how
// long the alert stays visible afterward, handled separately below.
function showAlert(job, onDone) {
  const mode = fields.alertDisplayMode;
  const interruptMode = fields.alertInterruptMode;

  if (mode === 'pinned') {
    alertPinned.innerHTML = '';
    alertPinned.classList.add('active');
    const myToken = ++pinnedToken;
    runAlertSteps(alertPinned, job.steps, () => {
      onDone();
      // duration === 0 means stay visible indefinitely (until replaced
      // by the next pinned alert) - simply never schedule a clear.
      if (job.duration > 0) {
        setTimeout(() => {
          if (pinnedToken === myToken) {
            alertPinned.classList.remove('active');
            alertPinned.innerHTML = '';
          }
        }, job.duration);
      }
    }, false);
    return;
  }

  if (interruptMode === 'takeover') {
    alertTakeover.innerHTML = '';
    alertTakeover.classList.add('active');
    const myToken = ++takeoverToken;
    runAlertSteps(alertTakeover, job.steps, () => {
      onDone();
      if (job.duration > 0) {
        setTimeout(() => {
          if (takeoverToken === myToken) {
            alertTakeover.classList.remove('active');
            alertTakeover.innerHTML = '';
          }
        }, job.duration);
      }
    }, false);
    return;
  }

  // Remaining modes (Pause / Inline) both render the alert's lines
  // directly into the real chat log, via a small wrapper that tracks
  // which elements it inserted so they can be cleanly removed later.
  if (interruptMode === 'pause') {
    chatPaused = true;
  }

  const inserted = [];
  const wrapAppend = target => {
    const originalAppend = target.appendChild.bind(target);
    return el => { inserted.push(el); return originalAppend(el); };
  };
  const fakeTarget = { appendChild: wrapAppend(container) };
  runAlertSteps(fakeTarget, job.steps, () => {
    const clearInserted = () => {
      inserted.forEach(el => { if (el.parentNode) el.parentNode.removeChild(el); });
    };

    if (interruptMode === 'inline') {
      // Inline never blocks chat or the alert queue - it just adds its
      // own lines alongside whatever chat is already doing.
      if (job.duration > 0) setTimeout(clearInserted, job.duration);
      onDone();
      return;
    }

    // Pause mode: the alert queue itself can still advance immediately
    // (onDone), but chat only actually resumes typing once this alert's
    // duration elapses. duration === 0 means chat stays paused
    // indefinitely on this alert, which is the literal, intended
    // consequence of choosing "pause until it finishes" + "never finishes".
    onDone();
    const resumeChat = () => {
      clearInserted();
      chatPaused = false;
      processQueue();
    };
    if (job.duration > 0) setTimeout(resumeChat, job.duration);
  }, true);
}

// ---------------------------------------------------------------------
// Test / preview mode
// ---------------------------------------------------------------------
// Only handles the chat sample loop. Alerts are previewed using
// StreamElements' own "Emulate" button in the editor toolbar instead,
// which fires real-shaped test events through the same code path a
// live event would use - no separate simulation needed for those.

function startTestLoop() {
  if (testTimer) return;
  let i = 0;
  const testColors = ['#f97316', '#22c55e', '#3b82f6', '#ec4899', '#eab308'];
  const sendOne = () => {
    if (isLive) return;
    const name = TEST_NAMES[i % TEST_NAMES.length];
    const text = TEST_MESSAGES[Math.floor(Math.random() * TEST_MESSAGES.length)];
    const color = testColors[i % testColors.length];
    resolvePronoun(null, true).then(pronoun => {
      queueMessage({ displayName: name, text: text, badges: [], color: color, pronoun: pronoun });
    });
    i++;
  };
  sendOne(); // fire the first message immediately, rather than waiting for the first interval tick
  testTimer = setInterval(sendOne, 4000);
}

function stopTestLoop() {
  if (testTimer) {
    clearInterval(testTimer);
    testTimer = null;
  }
}

function updateTestLoop() {
  if (isLive) return;
  if (fields.testMode) {
    startTestLoop();
  } else {
    stopTestLoop();
  }
}

// ---------------------------------------------------------------------
// StreamElements wiring
// ---------------------------------------------------------------------

// Fires once when the widget loads (and again whenever the streamer
// changes a setting in the editor). Pulls in the saved field values,
// converting any *Duration fields from the seconds shown in the editor
// to the milliseconds used internally.
window.addEventListener('onWidgetLoad', function (obj) {
  if (obj.detail.currency && obj.detail.currency.symbol) {
    currencySymbol = obj.detail.currency.symbol;
  }
  const fd = obj.detail.fieldData || {};
  fields = Object.assign(fields, {
    promptFormat: fd.promptFormat || fields.promptFormat,
    fontSource: fd.fontSource || fields.fontSource,
    localFontName: fd.localFontName !== undefined ? fd.localFontName : fields.localFontName,
    customFont: fd.customFont !== undefined ? fd.customFont : fields.customFont,
    phosphor: fd.phosphor || fields.phosphor,
    useCustomTextColor: fd.useCustomTextColor !== undefined ? fd.useCustomTextColor : fields.useCustomTextColor,
    customTextColor: fd.customTextColor || fields.customTextColor,
    useTwitchColor: fd.useTwitchColor !== undefined ? fd.useTwitchColor : fields.useTwitchColor,
    useCustomFrameColor: fd.useCustomFrameColor !== undefined ? fd.useCustomFrameColor : fields.useCustomFrameColor,
    customFrameColor: fd.customFrameColor || fields.customFrameColor,
    scanlines: fd.scanlines !== undefined ? fd.scanlines : fields.scanlines,
    flicker: fd.flicker !== undefined ? fd.flicker : fields.flicker,
    glow: fd.glow !== undefined ? fd.glow : fields.glow,
    curvature: fd.curvature !== undefined ? fd.curvature : fields.curvature,
    showBackground: fd.showBackground !== undefined ? fd.showBackground : fields.showBackground,
    showMonitorFrame: fd.showMonitorFrame !== undefined ? fd.showMonitorFrame : fields.showMonitorFrame,
    showBadges: fd.showBadges !== undefined ? fd.showBadges : fields.showBadges,
    showDividers: fd.showDividers !== undefined ? fd.showDividers : fields.showDividers,
    roomySpacing: fd.roomySpacing !== undefined ? fd.roomySpacing : fields.roomySpacing,
    maxLineWidth: fd.maxLineWidth !== undefined ? fd.maxLineWidth : fields.maxLineWidth,
    lineWidthChars: fd.lineWidthChars || fields.lineWidthChars,
    showTimestamps: fd.showTimestamps !== undefined ? fd.showTimestamps : fields.showTimestamps,
    messageDuration: fd.messageDuration !== undefined ? fd.messageDuration * 1000 : fields.messageDuration,
    typeSpeed: fd.typeSpeed || fields.typeSpeed,
    fontSize: fd.fontSize || fields.fontSize,
    testMode: fd.testMode !== undefined ? fd.testMode : fields.testMode,
    alertDisplayMode: fd.alertDisplayMode || fields.alertDisplayMode,
    alertInterruptMode: fd.alertInterruptMode || fields.alertInterruptMode,
    enableFollowAlert: fd.enableFollowAlert !== undefined ? fd.enableFollowAlert : fields.enableFollowAlert,
    followAlertDuration: fd.followAlertDuration !== undefined ? fd.followAlertDuration * 1000 : fields.followAlertDuration,
    enableSubAlert: fd.enableSubAlert !== undefined ? fd.enableSubAlert : fields.enableSubAlert,
    subAlertDuration: fd.subAlertDuration !== undefined ? fd.subAlertDuration * 1000 : fields.subAlertDuration,
    enableBitsAlert: fd.enableBitsAlert !== undefined ? fd.enableBitsAlert : fields.enableBitsAlert,
    bitsAlertDuration: fd.bitsAlertDuration !== undefined ? fd.bitsAlertDuration * 1000 : fields.bitsAlertDuration,
    enableDonoAlert: fd.enableDonoAlert !== undefined ? fd.enableDonoAlert : fields.enableDonoAlert,
    donoAlertDuration: fd.donoAlertDuration !== undefined ? fd.donoAlertDuration * 1000 : fields.donoAlertDuration,
    enableRaidAlert: fd.enableRaidAlert !== undefined ? fd.enableRaidAlert : fields.enableRaidAlert,
    raidAlertDuration: fd.raidAlertDuration !== undefined ? fd.raidAlertDuration * 1000 : fields.raidAlertDuration,
    followFormat: fd.followFormat || fields.followFormat,
    subFormatLine1: fd.subFormatLine1 || fields.subFormatLine1,
    subFormatLine2: fd.subFormatLine2 || fields.subFormatLine2,
    bitsFormat: fd.bitsFormat || fields.bitsFormat,
    bitsCompleteText: fd.bitsCompleteText || fields.bitsCompleteText,
    donoFormatLine1: fd.donoFormatLine1 || fields.donoFormatLine1,
    donoFormatLine2: fd.donoFormatLine2 || fields.donoFormatLine2,
    raidBannerText: fd.raidBannerText || fields.raidBannerText,
    raidFormat: fd.raidFormat || fields.raidFormat,
    raidCompleteText: fd.raidCompleteText || fields.raidCompleteText,
    includeEveryone: fd.includeEveryone !== undefined ? fd.includeEveryone : fields.includeEveryone,
    includeSubs: fd.includeSubs !== undefined ? fd.includeSubs : fields.includeSubs,
    includeVIPs: fd.includeVIPs !== undefined ? fd.includeVIPs : fields.includeVIPs,
    includeMods: fd.includeMods !== undefined ? fd.includeMods : fields.includeMods,
    allowUsers: fd.allowUsers !== undefined ? fd.allowUsers : fields.allowUsers,
    ignoreUsers: fd.ignoreUsers !== undefined ? fd.ignoreUsers : fields.ignoreUsers,
    ignorePrefixes: fd.ignorePrefixes !== undefined ? fd.ignorePrefixes : fields.ignorePrefixes,
    pronounsMode: fd.pronounsMode || fields.pronounsMode,
    pronounsLowercase: fd.pronounsLowercase !== undefined ? fd.pronounsLowercase : fields.pronounsLowercase,
    customPronounColors: fd.customPronounColors !== undefined ? fd.customPronounColors : fields.customPronounColors,
    pronounBackgroundColor: fd.pronounBackgroundColor || fields.pronounBackgroundColor,
    pronounBorderColor: fd.pronounBorderColor || fields.pronounBorderColor,
    pronounTextColor: fd.pronounTextColor || fields.pronounTextColor
  });
  // Only bother fetching the pronoun list at all if pronouns are enabled.
  if (fields.pronounsMode !== 'off') ensurePronounList();
  applyEffectClasses();
  updateTestLoop();
});

// Handles both real chat messages and every alert type. Note the
// different data shapes: chat 'message' events carry their payload at
// obj.detail.event.data, but alert events (follower-latest,
// subscriber-latest, cheer-latest, tip-latest, raid-latest) carry it
// directly on obj.detail.event instead - there's no nested .data for
// those. Getting this wrong silently breaks alerts without any error,
// which is exactly what happened during development before it got
// fixed against StreamElements' actual docs.
window.addEventListener('onEventReceived', function (obj) {
  if (!obj.detail || !obj.detail.listener) return;
  const listener = obj.detail.listener;

  if (listener === 'message') {
    const data = obj.detail.event.data;
    handleChatEvent({
      nick: data.nick,
      displayName: data.displayName || data.nick,
      text: data.text,
      badges: data.badges,
      displayColor: data.displayColor,
      tags: data.tags,
      emotes: data.emotes
    });
    return;
  }

  const data = obj.detail.event;

  if (listener === 'follower-latest' && fields.enableFollowAlert) {
    isLive = true;
    stopTestLoop();
    const name = data.name;
    queueAlert({ type: 'follow', steps: buildFollowSteps(name), duration: fields.followAlertDuration });
    return;
  }

  if (listener === 'subscriber-latest' && fields.enableSubAlert) {
    isLive = true;
    stopTestLoop();
    const name = data.name;
    const tier = data.tier || data.amount;
    queueAlert({ type: 'sub', steps: buildSubSteps(name, tier), duration: fields.subAlertDuration });
    return;
  }

  if (listener === 'cheer-latest' && fields.enableBitsAlert) {
    isLive = true;
    stopTestLoop();
    const name = data.name;
    const amount = data.amount;
    queueAlert({ type: 'bits', steps: buildBitsSteps(name, amount), duration: fields.bitsAlertDuration });
    return;
  }

  if (listener === 'tip-latest' && fields.enableDonoAlert) {
    isLive = true;
    stopTestLoop();
    const name = data.name;
    const amount = data.amount;
    const currency = currencySymbol;
    queueAlert({ type: 'dono', steps: buildDonoSteps(name, amount, currency), duration: fields.donoAlertDuration });
    return;
  }

  if (listener === 'raid-latest' && fields.enableRaidAlert) {
    isLive = true;
    stopTestLoop();
    const name = data.name;
    const amount = data.amount;
    queueAlert({ type: 'raid', steps: buildRaidSteps(name, amount), duration: fields.raidAlertDuration });
  }
});
})();

</script>

    session: { data: {} },

  },
}));
</script>
